<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha Rotina</title>
<meta name="theme-color" content="#FBFBF7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rotina">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFBF7; --grid:#E9ECF3; --ink:#1A2550; --ink-soft:#5B6382; --line:#D6DAE6;
  --card:#FFFFFF;
  --est:#2F5BD3; --est-bg:#E7EDFC; --est-bd:#A9BCF0;
  --tre:#C2410C; --tre-bg:#FDE8DC; --tre-bd:#F0B394;
  --off:#6B6F7E; --off-bg:#F0F1F4; --off-bd:#C3C6D0;
  --mark:#FFE45C; --ok:#1F8A4C; --ok-bg:#DDF3E5; --warn:#A15C00; --warn-bg:#FFF1D6; --bad:#C0262D;
  --a-mat:#2F5BD3; --a-nat:#1F8A4C; --a-ling:#8B3FC4; --a-hum:#B4540A; --a-red:#C0262D; --a-tec:#0E7490;
  --shadow:0 1px 0 rgba(26,37,80,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11162A; --grid:#1A2140; --ink:#E9ECF7; --ink-soft:#9AA2C2; --line:#2B3459; --card:#171E38;
    --est:#8FB0FF; --est-bg:#1D2A55; --est-bd:#34488A;
    --tre:#FFA37A; --tre-bg:#3E2419; --tre-bd:#7A3D22;
    --off:#A0A5B8; --off-bg:#1E2440; --off-bd:#3A4266;
    --mark:#8A7400; --ok:#6FDB9A; --ok-bg:#163A27; --warn:#FFC266; --warn-bg:#3A2A10; --bad:#FF7A80;
    --a-mat:#8FB0FF; --a-nat:#6FDB9A; --a-ling:#D2A6FF; --a-hum:#FFB070; --a-red:#FF8A8F; --a-tec:#5ED3EE;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --paper:#11162A; --grid:#1A2140; --ink:#E9ECF7; --ink-soft:#9AA2C2; --line:#2B3459; --card:#171E38;
  --est:#8FB0FF; --est-bg:#1D2A55; --est-bd:#34488A;
  --tre:#FFA37A; --tre-bg:#3E2419; --tre-bd:#7A3D22;
  --off:#A0A5B8; --off-bg:#1E2440; --off-bd:#3A4266;
  --mark:#8A7400; --ok:#6FDB9A; --ok-bg:#163A27; --warn:#FFC266; --warn-bg:#3A2A10; --bad:#FF7A80;
  --a-mat:#8FB0FF; --a-nat:#6FDB9A; --a-ling:#D2A6FF; --a-hum:#FFB070; --a-red:#FF8A8F; --a-tec:#5ED3EE;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink); font-family:'Manrope',system-ui,sans-serif; font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--est);outline-offset:2px;border-radius:6px}
.wrap{max-width:1240px;margin:0 auto;padding:24px 16px 120px}
h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;margin:0;letter-spacing:-.02em}
input,select,textarea{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper);width:100%}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--ink-soft)}

/* Topo */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.brand h1{font-size:clamp(32px,6vw,52px);font-weight:800;line-height:1}
.brand p{margin:6px 0 0;color:var(--ink-soft);font-weight:500}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:8px 14px;min-width:104px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:26px;line-height:1.1}
.stat span{font-size:13px;color:var(--ink-soft);font-weight:600}
.stat.warn{background:var(--warn-bg);border-color:var(--warn)} .stat.warn b{color:var(--warn)}

/* Navegação */
.nav{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:22px;border-bottom:2px solid var(--ink);padding-bottom:10px}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:700;color:var(--ink-soft)}
.tab[aria-current="page"]{background:var(--ink);color:var(--paper)}
.tab:hover:not([aria-current="page"]){color:var(--ink)}
.nav .sp{flex:1}
.icon-btn{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.icon-btn svg{width:16px;height:16px}
.btn{border:0;background:var(--ink);color:var(--paper);border-radius:999px;padding:10px 18px;font-weight:800}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn.sm{padding:6px 12px;font-size:14px}
.link{border:0;background:transparent;font-size:14px;font-weight:700;color:var(--est);padding:4px 0;text-decoration:underline;text-underline-offset:3px}

/* Blocos */
.block{border-radius:14px;padding:12px 14px;border:1.5px solid;display:flex;gap:12px;align-items:flex-start}
.block.estudo{background:var(--est-bg);border-color:var(--est-bd)}
.block.treino{background:var(--tre-bg);border-color:var(--tre-bd)}
.block.descanso{background:var(--off-bg);border-color:var(--off-bd);border-style:dashed}
.block .body{flex:1;min-width:0}
.kind{font-size:13px;font-weight:800;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.estudo .kind{color:var(--est)} .treino .kind{color:var(--tre)} .descanso .kind{color:var(--off)}
.kind .time{font-weight:700;color:var(--ink-soft);background:var(--card);border-radius:999px;padding:0 8px}
.items{margin:4px 0 0;padding:0;list-style:none;font-weight:700}
.items li{line-height:1.3}
.descanso .items{font-weight:500;color:var(--off)}
.block.done .items{text-decoration:line-through;text-decoration-thickness:2px;opacity:.6}
.check{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid currentColor;background:var(--card);display:grid;place-items:center;padding:0}
.estudo .check{color:var(--est)} .treino .check{color:var(--tre)}
.check svg{width:18px;height:18px;opacity:0;transition:opacity .12s}
.done .check{background:currentColor}
.done .check svg{opacity:1;color:var(--card)}
.topicbox{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.topicbox select{background:var(--card);font-weight:600;font-size:14px;padding:6px 8px}
.topicbox .lbl{font-size:12px;font-weight:700;color:var(--ink-soft)}
.pick{font-size:13px;font-weight:600;color:var(--ink-soft);margin-top:4px}
.extra{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}

/* Hoje */
.today{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px}
@media (max-width:820px){.today{grid-template-columns:1fr}}
.dayname{font-size:clamp(44px,9vw,88px);font-weight:800;line-height:.95;display:inline;background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 90%,transparent 90%);padding:0 6px;margin-left:-6px}
.date{color:var(--ink-soft);font-weight:600;margin:10px 0 18px}
.list{display:flex;flex-direction:column;gap:10px}
.progress{height:12px;border-radius:999px;background:var(--off-bg);border:1.5px solid var(--line);overflow:hidden;margin:4px 0 18px}
.progress i{display:block;height:100%;background:var(--ok);transition:width .3s}
.progress.thin{height:8px;margin:6px 0 0;border-width:1px}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.panel h3{font-size:20px;margin-bottom:10px}
.stack > * + *{margin-top:16px}
textarea{min-height:110px;resize:vertical}
.next .block{padding:8px 12px}
.next .items{font-size:14px}
.empty{color:var(--ink-soft);font-weight:500;margin:0}
.allgood{background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:10px 14px;font-weight:800;margin-bottom:12px}
.rev{display:flex;flex-direction:column;gap:8px}
.revrow{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.revrow b{line-height:1.3}
.revrow .meta{font-size:13px;color:var(--ink-soft);font-weight:600}
.revrow .acts{display:flex;gap:6px;flex-wrap:wrap}

/* Semana */
.weekbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.weekbar h2{font-size:22px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:1000px){.week{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.week{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.colhead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px solid var(--ink);padding-bottom:4px}
.colhead h3{font-size:24px}
.colhead span{font-size:13px;font-weight:700;color:var(--ink-soft)}
.col.is-today .colhead h3{background:linear-gradient(transparent 55%,var(--mark) 55%,var(--mark) 92%,transparent 92%);padding:0 4px;margin-left:-4px}
.col .block{padding:10px;gap:8px}
.col .check{width:26px;height:26px}
.col .items{font-size:15px}
.col .kind .time{background:transparent;padding:0}
.dots{font-size:13px;color:var(--ink-soft);font-weight:700}

/* Conteúdo */
.summary{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:16px;align-items:start}
.area-h{display:flex;align-items:center;gap:10px}
.sw{width:14px;height:14px;border-radius:4px;flex:none}
.area-h h2{font-size:26px}
.area-h .cnt{margin-left:auto;font-weight:800;font-size:14px;color:var(--ink-soft);white-space:nowrap}
.area p.desc{margin:4px 0 8px;color:var(--ink-soft);font-weight:500;font-size:15px}
details.grp{border-top:1.5px solid var(--line);padding:8px 0}
details.grp summary{cursor:pointer;font-weight:800;display:flex;justify-content:space-between;gap:8px;list-style:none;padding:4px 0}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary::before{content:'+';width:18px;font-weight:800;color:var(--ink-soft)}
details.grp[open] summary::before{content:'−'}
details.grp summary span.t{flex:1}
details.grp summary span.c{font-size:13px;color:var(--ink-soft)}
.topics{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.topic{display:flex;align-items:center;gap:10px;padding:5px 0}
.topic .nm{flex:1;min-width:0;font-weight:600;line-height:1.3}
.topic.s3 .nm{color:var(--ink-soft)}
.hot{font-size:12px;font-weight:800;color:var(--warn);background:var(--warn-bg);border-radius:999px;padding:1px 8px;white-space:nowrap}
.nx{font-size:12px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
.nx.due{color:var(--warn)}
.st{flex:none;min-width:104px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);padding:4px 10px;font-size:13px;font-weight:800;display:inline-flex;align-items:center;gap:6px;justify-content:flex-start}
.st i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink-soft);flex:none}
.st.s1{border-color:var(--est-bd);color:var(--est)} .st.s1 i{border-color:var(--est);background:linear-gradient(90deg,var(--est) 50%,transparent 50%)}
.st.s2{border-color:var(--est);color:var(--est);background:var(--est-bg)} .st.s2 i{border-color:var(--est);background:var(--est)}
.st.s3{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)} .st.s3 i{border-color:var(--ok);background:var(--ok)}
.legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--ink-soft);font-weight:600}

.trailnav{margin-bottom:12px}
@media (max-width:560px){.trailnav{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;margin-left:-16px;margin-right:-16px;padding-left:16px;padding-right:16px}.trailnav .chip{white-space:nowrap}}
.chip small{font-weight:600;opacity:.75}
.chips .lbl{font-size:13px;font-weight:700;color:var(--ink-soft);align-self:center;margin-right:2px}
.matgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.matcard{display:flex;flex-direction:column;gap:8px}
.matcard h3{font-size:20px;margin:0}
.matcard .btn{align-self:flex-start;margin-top:auto}
.nextline{margin:0;font-weight:700;font-size:15px;line-height:1.3}
.nextline span{display:block;font-size:12px;color:var(--ink-soft);font-weight:700}
.trail .desc{margin:4px 0 8px;color:var(--ink-soft);font-weight:500}
.stage{border-top:1.5px solid var(--line);padding-top:10px;margin-top:12px}
.stage-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.stage-h h3{font-size:18px;margin:0}
.stage-h span{font-size:13px;font-weight:800;color:var(--ink-soft)}
.trail .topic{padding:6px 8px;margin:0 -8px;border-radius:10px}
.trail .topic.next{background:color-mix(in srgb,var(--mark) 45%,transparent)}
.num{flex:none;width:26px;text-align:right;font-weight:800;font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.topic .nm small{display:block;font-size:12px;font-weight:600;color:var(--ink-soft)}
.topic .nm small.here{color:var(--ink);font-weight:800}
.trailbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.eacts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.eacts button{border:1.5px solid var(--line);background:var(--paper);border-radius:8px;min-width:36px;height:34px;padding:0 10px;font-weight:700;font-size:13px}
.eacts button:disabled{opacity:.35;cursor:default}
.eacts button.d{color:var(--bad)}
.trail .topic.editing{border-bottom:1px solid var(--line);border-radius:0}
.addrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.addrow input{flex:1 1 220px;width:auto}
.addrow select{flex:0 1 170px;width:auto}
.addmod h3{font-size:18px;margin:0}
.newmat{border-style:dashed}
.newmat h3{font-size:20px;margin:0}
.low{font-size:12px;font-weight:700;color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:0 8px;white-space:nowrap}
@media (max-width:560px){.trail .topic{flex-wrap:wrap}.trail .topic .nm{flex-basis:calc(100% - 150px)}}

/* Redação */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-weight:800;font-family:'Bricolage Grotesque',sans-serif}
.steps b{display:block}
.steps span{color:var(--ink-soft);font-size:15px}
.five{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.five span{background:var(--warn-bg);color:var(--warn);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800}
.form{display:grid;gap:10px}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
@media (max-width:520px){.grid5{grid-template-columns:repeat(3,minmax(0,1fr))}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.row2{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:12px;color:var(--ink-soft)}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto}
.del{border:0;background:transparent;color:var(--bad);font-weight:800;font-size:18px;padding:0 6px;line-height:1}
.comp{display:flex;flex-direction:column;gap:8px}
.comp .r{display:grid;grid-template-columns:36px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:14px;font-weight:700}
.comp .r small{display:block;font-weight:500;color:var(--ink-soft);font-size:12px}
.meter{height:10px;border-radius:999px;background:var(--off-bg);overflow:hidden}
.meter i{display:block;height:100%;background:var(--est)}
.meter.low i{background:var(--warn)}
.callout{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px;margin-top:10px}
.replist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.replist li{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.replist li div{flex:1;min-width:0}
.replist .tp{font-size:12px;font-weight:800;color:var(--est)}
.replist .ex{font-size:13px;color:var(--ink-soft);font-weight:600}

/* Progresso */
.statsgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;align-items:start}
.bars{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bar i{display:block;width:100%;max-width:44px;border-radius:8px 8px 3px 3px;background:var(--est);min-height:3px}
.bar.cur i{background:var(--ok)}
.bar small{font-size:11px;color:var(--ink-soft);font-weight:700;white-space:nowrap}
.bar b{font-size:12px}
.split{display:flex;flex-direction:column;gap:12px}
.split .row{display:flex;justify-content:space-between;gap:8px;font-weight:700;margin-bottom:2px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat div{aspect-ratio:1;border-radius:5px;background:var(--off-bg);border:1px solid var(--line)}
.heat .l1{background:color-mix(in srgb,var(--ok) 30%,var(--off-bg))}
.heat .l2{background:color-mix(in srgb,var(--ok) 60%,var(--off-bg))}
.heat .l3{background:var(--ok)}
.heat .fut{opacity:.35}
.hint{color:var(--ink-soft);font-size:14px;margin:0 0 14px}
.up{color:var(--ok);font-weight:800} .down{color:var(--bad);font-weight:800}

/* Editar */
.editday{margin-bottom:18px}
.editday h3{font-size:22px;margin-bottom:8px}
.erow{display:grid;grid-template-columns:110px minmax(0,1fr) 110px 190px auto;gap:8px;align-items:center;margin-bottom:8px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px}
@media (max-width:860px){.erow{grid-template-columns:1fr 1fr}.erow .items-in{grid-column:1/-1;order:-1}.erow .acts{grid-column:1/-1}}
.acts{display:flex;gap:4px;justify-content:flex-end}
.erow .acts button{border:1.5px solid var(--line);background:var(--paper);border-radius:8px;width:36px;height:36px;font-weight:800}
.erow .acts button.d{color:var(--bad)}
.add{border:1.5px dashed var(--ink-soft);background:transparent;border-radius:12px;padding:8px 12px;font-weight:700;color:var(--ink-soft)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 22px;align-items:flex-end}

/* Diagnóstico */
.riskgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin-bottom:16px}
.risk{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.risk .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0}
.risk h3{font-size:18px}
.risk .idx{font-family:'Bricolage Grotesque',sans-serif;font-size:44px;font-weight:800;line-height:1}
.risk .idx small{font-size:16px;color:var(--ink-soft);font-weight:600}
.lvl{font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;white-space:nowrap}
.lvl.l0{background:var(--ok-bg);color:var(--ok)} .lvl.l1{background:var(--est-bg);color:var(--est)}
.lvl.l2{background:var(--warn-bg);color:var(--warn)} .lvl.l3{background:var(--bad);color:var(--card)}
.risk .meter i{background:var(--ink-soft)}
.risk.r2 .meter i{background:var(--warn)} .risk.r3 .meter i{background:var(--bad)} .risk.r0 .meter i{background:var(--ok)}
.drivers{list-style:none;margin:0;padding:0;font-size:13px;display:flex;flex-direction:column;gap:3px}
.drivers li{display:flex;justify-content:space-between;gap:8px;color:var(--ink-soft);font-weight:600}
.drivers li b{color:var(--ink);font-weight:700;text-align:right}
.alerts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.alerts li{border-radius:12px;padding:10px 12px;font-weight:600;font-size:15px;line-height:1.35}
.alerts li.crit{background:var(--bad);color:var(--card)}
.alerts li.high{background:var(--warn-bg);color:var(--warn)}
.alerts li.info{background:var(--est-bg);color:var(--est)}
.hours{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
@media (max-width:620px){.hours{grid-template-columns:repeat(4,minmax(0,1fr))}}
.checks{display:flex;gap:6px 14px;flex-wrap:wrap;font-weight:600;font-size:15px}
.checks label{display:flex;gap:6px;align-items:center}
.checks input{width:auto}
.planweek{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:12px}
@media (max-width:1000px){.planweek{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.planweek{grid-template-columns:1fr}}
.planweek .col .block{padding:8px 10px}
.planweek .items{font-size:14px}
.tips{margin:10px 0 0;padding-left:20px;color:var(--ink-soft);font-size:15px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}

/* Conta e sincronização */
.dot{width:10px;height:10px;border-radius:50%;background:var(--off-bd);flex:none}
.dot.ok{background:var(--ok)} .dot.busy{background:var(--est)} .dot.err{background:var(--warn)}
.account{max-width:520px}
.account .form{margin-top:10px}
.account .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px;margin-top:12px}
.msg.ok{background:var(--ok-bg);color:var(--ok)} .msg.err{background:var(--warn-bg);color:var(--warn)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv span:first-child{color:var(--ink-soft);font-weight:600}
.kv span:last-child{font-weight:700;text-align:right;overflow-wrap:anywhere}

/* Timer */
.timer{position:fixed;right:16px;bottom:16px;width:300px;max-width:calc(100vw - 32px);background:var(--ink);color:var(--paper);border-radius:20px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:20}
.timer[hidden]{display:none}
.timer .lbl{font-size:13px;opacity:.85;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer .clock{font-family:'Bricolage Grotesque',sans-serif;font-size:48px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.timer .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.timer button{border:1.5px solid rgba(255,255,255,.35);background:transparent;color:inherit;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
.timer button.main{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:700;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Impressão: imprime a tela aberta */
@page{size:A4 portrait;margin:12mm}
@page land{size:A4 landscape;margin:10mm}
@media print{
  body{background:#fff;color:#000}
  .nav,.stats,.timer,.toast,.check,.link,.no-print,.weekbar button,.chips,.topicbox select{display:none!important}
  .wrap{padding:0;max-width:none}
  .week{page:land;grid-template-columns:repeat(7,1fr)!important;gap:8px}
  .block.done .items{text-decoration:none;opacity:1}
  .panel{box-shadow:none;break-inside:avoid}
  .areas{display:block}.areas .panel{margin-bottom:12px}
  .st{min-width:0;border:0;padding:0}.st span{display:none}
  .st i{width:14px;height:14px;border-radius:3px}
}

/* Prática, metas e conquistas */
h4.sub{font-size:13px;color:var(--ink-soft);margin:16px 0 4px;font-weight:800}
.mrow{display:grid;grid-template-columns:minmax(110px,1.3fr) 2fr auto;gap:8px;align-items:center;font-size:14px;font-weight:600;margin:7px 0}
.mrow b{text-align:right;font-variant-numeric:tabular-nums}
.errlist{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.errlist li{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.errlist li.ok{opacity:.7}
.errlist .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.tag{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:1px 9px;background:var(--warn-bg);color:var(--warn);margin-right:6px}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.errmeta{font-size:13px;color:var(--ink-soft);font-weight:600;margin:2px 0 0}
.errnote{font-size:14px;margin-top:4px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.filters label.f{min-width:140px;flex:1}
.bignum{font-size:34px;font-weight:800;margin:0 0 8px;font-variant-numeric:tabular-nums;line-height:1.1}
.bignum small{font-size:15px;color:var(--ink-soft);font-weight:700}
.heat .rel{background:var(--bad);border-color:var(--bad);display:flex;align-items:center;justify-content:center;color:var(--paper);font-size:12px;font-weight:800;line-height:1}
.heat .rel::after{content:'×'}
ul.plan,ol.plan{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-weight:600}
label.chip{display:inline-flex;align-items:center;cursor:pointer;gap:6px}
label.chip input[type=checkbox]{width:auto;flex:none;margin:0;padding:0;accent-color:var(--ink)}
label.chip:has(input:checked){background:var(--ink);color:var(--paper);border-color:var(--ink)}
#habRelForm textarea,#habPlanForm textarea{min-height:60px}
.simclock{font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(44px,12vw,84px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.simclock.over{color:var(--bad)}
.simacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.simcard{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.simcard .row{display:flex;justify-content:space-between;gap:8px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.badge{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--card)}
.badge b{display:block;line-height:1.2}
.badge span{font-size:13px;color:var(--ink-soft);font-weight:600}
.badge.off{opacity:.6;border-style:dashed}
.badge.on{border-color:var(--ok);background:var(--ok-bg)}
.badge.on b{color:var(--ok)}
h3.areahead{display:flex;align-items:center;gap:8px;margin:24px 0 10px;font-size:22px}
h3.areahead .sw{width:14px;height:14px;border-radius:4px;flex:none}
h3.areahead small{font-size:14px;color:var(--ink-soft);font-weight:700}
</style>
</head>

/* =========================================================
   TRILHA DEV: DESENVOLVEDOR FULLSTACK
   área → matéria (assunto) → etapa → tópico. Peso: 3 essencial, 2 normal, 1 avançado.
   Formato do tópico: "id|Nome|peso". O id final é dv-<matéria>-<id> e não pode mudar,
   porque o progresso fica guardado nele.
   ========================================================= */
function dm(slug,nome,desc,mods){
  return {id:"dv-"+slug,nome:nome,desc:desc,mods:mods.map(function(md){
    return {nome:md[0],t:md[1].split(";").map(function(x){var p=x.split("|");return ["dv-"+slug+"-"+p[0].trim(),p[1].trim(),+p[2]||2]})};
  })};
}

    if(key.indexOf('tec|')===0){var ids=c.order[key].filter(function(x){return x.indexOf('u-')===0});delete c.order[key];if(ids.length)c.order['dv-livre|'+key.slice(4)]=ids;ch=true}
  });
  return ch;
}
function migrateTopics(){
  var changed=false,nt={};
  Object.keys(topics).forEach(function(k){
    var to=OLD_IDS[k];
    if(!to){nt[k]=topics[k];return}
    changed=true;
    (Array.isArray(to)?to:[to]).forEach(function(id){
      var cur=nt[id]||topics[id];
      if(!cur||topics[k].s>cur.s)nt[id]=clone(topics[k]);
    });
  });
  Object.keys(picks).forEach(function(d){Object.keys(picks[d]).forEach(function(b){
    var p=picks[d][b],to=OLD_IDS[p.t];
    if(to){p.t=Array.isArray(to)?to[0]:to;changed=true}
  })});
  if(changed){topics=nt;save('topics',topics);save('picks',picks)}
}

function pk(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2])}

function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}

/* =========================================================
   TÓPICOS E REVISÃO ESPAÇADA (1, 7 e 30 dias)
   s: 0 não visto · 1 estudado · 2 revisado · 3 dominado
   ========================================================= */
var STATUS=['Não visto','Estudado','Revisado','Dominado'];
var REV=[1,7,30];
function tstate(id){return topics[id]||{s:0}}
function studyTopic(id,dateKey){
  var t=TOPICS[id];
  topics[id]={s:1,at:dateKey,n:0,next:t.rev?dkey(addDays(pk(dateKey),REV[0])):null};
  save('topics',topics);
}
function reviewTopic(id,ok){
  var t=topics[id];if(!t)return;
  bumpLog('r');
  if(ok){
    t.n=(t.n||0)+1;
    if(t.n>=REV.length){t.s=3;t.next=null}
    else{t.s=2;t.next=dkey(addDays(today(),REV[t.n]))}
  }else{t.next=dkey(addDays(today(),1))}
  save('topics',topics);
}
function cycleTopic(id){
  var s=tstate(id).s,rev=TOPICS[id].rev;
  if(s===0)studyTopic(id,tk());
  else if(s===1){topics[id].s=2;topics[id].n=1;topics[id].next=rev?dkey(addDays(today(),REV[1])):null}
  else if(s===2){topics[id].s=3;topics[id].next=null}
  else delete topics[id];
  save('topics',topics);
}
function dueReviews(){
  var k=tk();
  return Object.keys(topics).filter(function(id){return TOPICS[id]&&topics[id].next&&topics[id].next<=k})
    .sort(function(a,b){return topics[a].next<topics[b].next?-1:1});
}
function suggestTopic(subj){
  var list=topicsFor(subj).map(function(t){return t.id});
  list=trailOrder(list);
  for(var i=0;i<list.length;i++)if(tstate(list[i].id).s===0)return list[i].id;
  for(var j=0;j<list.length;j++)if(tstate(list[j].id).s<3)return list[j].id;
  return null;
}
function pickFor(dateKey,b){
  var p=picks[dateKey]&&picks[dateKey][b.id];
  if(p&&TOPICS[p.t])return p.t;
  return suggestTopic(b.subject);
}
function areaCoverage(areaId,kind){
  var list=TOPIC_LIST.filter(function(t){return areaId?t.area===areaId:t.trilha===(kind||'enem')});
  var st=0,dom=0;list.forEach(function(t){var s=tstate(t.id).s;if(s>=1)st++;if(s===3)dom++});
  return {total:list.length,studied:st,mastered:dom};
}

   ========================================================= */
function checkable(b){return b.type!=='descanso'}
function isDone(date,id){var p=progress[dkey(date)];return !!(p&&p[id])}
function setDone(date,b,val){
  var k=dkey(date);progress[k]=progress[k]||{};
  if(val){
    progress[k][b.id]=true;
    if(topicsFor(b.subject).length){
      var t=pickFor(k,b);
      if(t){
        var auto=tstate(t).s===0;
        if(auto)studyTopic(t,k);
        picks[k]=picks[k]||{};picks[k][b.id]={t:t,auto:auto};save('picks',picks);
        if(auto)toast('Tópico marcado como estudado'+(TOPICS[t].rev?'. Primeira revisão amanhã.':'.'));
      }
    }
  }else{
    delete progress[k][b.id];
    var p=picks[k]&&picks[k][b.id];
    if(p&&p.auto&&topics[p.t]&&topics[p.t].s===1&&topics[p.t].at===k){delete topics[p.t];p.auto=false;save('topics',topics);save('picks',picks)}
  }
  if(!Object.keys(progress[k]).length)delete progress[k];
  save('progress',progress);
}
function dayScore(date){
  var bl=routine[dayIdx(date)].filter(checkable);
  var done=bl.filter(function(b){return isDone(date,b.id)}).length;
  return {done:done,total:bl.length};
}
function rangeScore(from,days,filterType){
  var d=0,t=0;
  for(var i=0;i<days;i++){
    var dt=addDays(from,i);
    routine[dayIdx(dt)].forEach(function(b){
      if(!checkable(b))return;if(filterType&&b.type!==filterType)return;
      t++;if(isDone(dt,b.id))d++;
    });
  }
  return {done:d,total:t};
}
function pct(s){return s.total?Math.round(s.done/s.total*100):0}
function dayComplete(date){var s=dayScore(date);return s.total>0&&s.done===s.total}
function streakNow(){
  var d=today(),n=0;
  if(!dayComplete(d))d=addDays(d,-1);
  for(var i=0;i<400;i++){
    var s=dayScore(d);
    if(s.total===0){d=addDays(d,-1);continue}
    if(s.done===s.total){n++;d=addDays(d,-1)}else break;
  }
  return n;
}
function bestStreak(){var best=load('best',0),cur=streakNow();if(cur>best){best=cur;save('best',best)}return best}

function trailOrder(ids){
  var list=ids.map(function(id){return TOPICS[id]});
  if(load('trailMode','didatica')==='prioridade')list=list.slice().sort(function(a,b){return b.p-a.p||a.ord-b.ord});

}
function nextStep(ids){
  var list=trailOrder(ids);
  for(var i=0;i<list.length;i++)if(tstate(list[i].id).s===0)return list[i];
  for(var j=0;j<list.length;j++)if(tstate(list[j].id).s<3)return list[j];

}

    if(t.custom){
      if(!confirm('Apagar o tópico "'+t.nome+'"? O progresso dele também será apagado.'))return true;
      custom.topics=custom.topics.filter(function(x){return x.id!==id});delete topics[id];save('topics',topics);
    }else custom.hidden[id]=true;
    saveCustom();render();toast(t.custom?'Tópico apagado':'Tópico ocultado. Ele fica na lista de ocultos.');return true;
  }

    var mid=b.dataset.m;if(!confirm('Voltar esta trilha ao original? Os tópicos ocultos reaparecem e os nomes e a ordem originais voltam. Os tópicos que você criou continuam.'))return true;

    saveCustom();render();toast('Trilha original restaurada');return true;
  }
  if(a==='mat-ren'){
    var cm=custom.materias.filter(function(x){return x.id===b.dataset.m})[0];if(!cm)return true;
    var nn=prompt('Novo nome da matéria:',cm.nome);if(nn==null)return true;nn=cleanName(nn).slice(0,60);if(!nn)return true;

/* =========================================================
   ÍNDICE DE RISCO (algoritmo próprio, sem API)
   Para cada área do ENEM combina, de 0 a 1 (maior = mais risco):
   - Cobertura (35%): domínio dos tópicos; "cai muito" pesa 2x
   - Desempenho (30%): acertos do último simulado / média das redações
   - Negligência (20%): fatia dos blocos de estudo concluídos nos
     últimos 14 dias, comparada com a fatia esperada (1/5 por área)
   - Revisões atrasadas (15%)
   Componentes sem dados ficam de fora e os pesos são redistribuídos.
   ========================================================= */

var RISK_AREAS=['mat','nat','ling','hum','red'];
var SIM_FIELD={mat:'mt',nat:'cn',ling:'lc',hum:'ch'};
var LEVELS=['Baixo','Médio','Alto','Crítico'];
function levelOf(i){return i>=80?3:i>=60?2:i>=35?1:0}
function parseDur(s){
  s=String(s||'').toLowerCase().replace(',','.');var h=0,m;
  if((m=s.match(/(\d+(?:\.\d+)?)\s*h/)))h+=+m[1];
  if((m=s.match(/h\s*(\d{1,2})\b/)))h+=+m[1]/60;
  else if((m=s.match(/(\d+)\s*min/)))h+=+m[1]/60;
  return h;
}
function studyActivity(days){
  var act={},total=0,start=addDays(today(),-(days-1));
  RISK_AREAS.forEach(function(a){act[a]=0});
  for(var i=0;i<days;i++){
    var d=addDays(start,i);
    routine[dayIdx(d)].forEach(function(b){
      var a=AREA_OF_SUBJECT[b.subject];
      if(b.type==='estudo'&&a&&isDone(d,b.id)){act[a]++;total++}
    });
  }
  return {act:act,total:total};
}
function lastSim(field){
  var s=sims.filter(function(x){return x[field]!=null&&x[field]!==''}).sort(function(a,b){return a.date<b.date?1:-1});
  return s.length?s[0]:null;
}
function computeRisk(){
  var A=studyActivity(14),k=tk(),due={};
  dueReviews().forEach(function(id){due[id]=1});
  var since14=dkey(addDays(today(),-13));
  return RISK_AREAS.map(function(a){
    var area=areaById(a),list=TOPIC_LIST.filter(function(t){return t.area===a});
    var W=[0,.4,.7,1],ws=0,wd=0,studied=0,hotPending=[],overdue=0;
    list.forEach(function(t){var s=tstate(t.id).s,w=t.hot?2:1;ws+=w;wd+=w*W[s];if(s>=1)studied++;if(t.hot&&s===0)hotPending.push(t.nome);if(due[t.id])overdue++});
    var comp={},why={};
    comp.cov=1-wd/ws;why.cov=studied+'/'+list.length+' tópicos estudados'+(hotPending.length?' · '+hotPending.length+' que caem muito pendentes':'');
    if(a==='red'){
      var es=essays.slice().sort(function(x,y){return x.date<y.date?1:-1});
      if(es.length){var last3=es.slice(0,3),avg=Math.round(last3.reduce(function(s,e){return s+essayTotal(e)},0)/last3.length);comp.perf=1-avg/1000;why.perf='média '+avg+' nas últimas redações'}
      var recent=es.some(function(e){return e.date>=since14});
      comp.neg=recent?(A.total>=3?Math.max(0,Math.min(1,1-(A.act[a]/A.total)/.2)):0):1;
      why.neg=recent?'redação em dia nas últimas 2 semanas':'nenhuma redação registrada nas últimas 2 semanas';
    }else{
      var sm=lastSim(SIM_FIELD[a]);
      if(sm){comp.perf=1-sm[SIM_FIELD[a]]/45;why.perf=sm[SIM_FIELD[a]]+'/45 no último simulado'}
      if(A.total>=3){comp.neg=Math.max(0,Math.min(1,1-(A.act[a]/A.total)/.2));why.neg=A.act[a]+' de '+A.total+' blocos de estudo nas últimas 2 semanas'}
    }
    comp.rev=Math.min(1,overdue/5);why.rev=overdue+' revis'+(overdue===1?'ão atrasada':'ões atrasadas');
    var WT={cov:.35,perf:.30,neg:.20,rev:.15},sum=0,wsum=0,top=null,topv=-1;
    Object.keys(WT).forEach(function(c){if(comp[c]==null)return;sum+=WT[c]*comp[c];wsum+=WT[c];if(WT[c]*comp[c]>topv){topv=WT[c]*comp[c];top=c}});
    var idx=Math.round(100*sum/wsum);
    return {id:a,nome:area.nome,cor:area.cor,idx:idx,lvl:levelOf(idx),comp:comp,why:why,top:top,hotPending:hotPending,overdue:overdue,studied:studied,total:list.length,act:A.act[a],actTotal:A.total};
  });
}
function computeAlerts(R){
  R=R||computeRisk();var out=[],A=studyActivity(14);
  R.slice().sort(function(a,b){return b.idx-a.idx}).forEach(function(r){
    if(r.lvl>=2)out.push({lv:r.lvl===3?'crit':'high',t:r.nome+': risco '+LEVELS[r.lvl].toLowerCase()+' ('+r.idx+'). Principal motivo: '+r.why[r.top]+'.'});
  });
  if(A.total>=5){
    var sh=RISK_AREAS.map(function(a){return {a:a,p:A.act[a]/A.total}}).sort(function(x,y){return y.p-x.p});
    var hi=sh[0],lo=sh[sh.length-1];
    if(hi.p>=.4&&lo.p<=.08)out.push({lv:'high',t:'Desequilíbrio: nas últimas 2 semanas, '+Math.round(hi.p*100)+'% dos seus blocos de estudo foram de '+areaById(hi.a).nome+' e só '+Math.round(lo.p*100)+'% de '+areaById(lo.a).nome+'.'});
  }
  var hot=[];R.forEach(function(r){hot=hot.concat(r.hotPending)});
  if(hot.length)out.push({lv:'info',t:'Tópicos que caem muito e você ainda não estudou: '+hot.slice(0,4).join(', ')+(hot.length>4?' e mais '+(hot.length-4):'')+'.'});
  var od=dueReviews().length;if(od>=5)out.push({lv:'high',t:od+' revisões acumuladas. Sem revisar, o conteúdo estudado se perde.'});
  if(exam){
    var days=daysBetween(today(),pk(exam));
    if(days>0){
      var cut=dkey(addDays(today(),-27)),remaining=0,recent=0;
      TOPIC_LIST.forEach(function(t){if(t.trilha!=='enem')return;var s=topics[t.id];if(!s)remaining++;else if(s.at&&s.at>=cut)recent++});
      var pace=recent/4,weeks=days/7;
      if(remaining>0){
        if(pace===0)out.push({lv:'high',t:'Nenhum tópico novo nas últimas 4 semanas. Faltam '+remaining+' tópicos e '+Math.floor(weeks)+' semanas até a prova: '+Math.ceil(remaining/Math.max(weeks,1))+' por semana.'});
        else if(remaining/pace>weeks)out.push({lv:days<45?'crit':'high',t:'No ritmo atual ('+pace.toFixed(1).replace('.',',')+' tópicos por semana) você levaria '+Math.ceil(remaining/pace)+' semanas para ver os '+remaining+' tópicos restantes, mas faltam '+Math.floor(weeks)+'. Meta: '+Math.ceil(remaining/Math.max(weeks,1))+' tópicos por semana.'});
      }
    }
  }
  var ES=errStats(30);
  if(ES.list.length>=5){
    var mo=sortedCounts(ES.mot)[0],share=mo[1]/ES.list.length;
    if(share>=.4&&MOTIVO_DICA[mo[0]])out.push({lv:share>=.5?'high':'info',t:'Seus erros dos últimos 30 dias: '+Math.round(share*100)+'% são "'+MOTIVO[mo[0]].toLowerCase()+'". Ação: '+MOTIVO_DICA[mo[0]].charAt(0).toUpperCase()+MOTIVO_DICA[mo[0]].slice(1)});
  }
  sortedCounts(ES.top).filter(function(p){return p[1]>=3}).slice(0,2).forEach(function(p){out.push({lv:'high',t:'Você errou "'+TOPICS[p[0]].nome+'" '+p[1]+' vezes e ainda não resolveu. Revise o tópico e refaça as questões do caderno.'})});
  if(!sims.length&&!essays.length)out.push({lv:'info',t:'Registre simulados e redações para o índice considerar seu desempenho, não só o conteúdo estudado.'});
  return out;
}
function alertsHTML(list){return '<ul class="alerts">'+list.map(function(a){return '<li class="'+a.lv+'">'+esc(a.t)+'</li>'}).join('')+'</ul>'}

/* =========================================================
   TELA: DIAGNÓSTICO + GERADOR DE PLANO COM IA
   ========================================================= */
var aiPlan=null,aiBusy=false,aiErr='';
function defaultHours(){return routine.map(function(day){var h=0;day.forEach(function(b){if(b.type==='estudo')h+=parseDur(b.time)});return Math.round(h*2)/2})}

  var R=computeRisk(),AL=computeAlerts(R);

async function generatePlan(f){
  aiErr='';
  if(!sb||!user){aiErr='Entre na sua conta (botão no menu) para usar o gerador com IA.';render();return}
  var fd=new FormData(f),R=computeRisk();
  var payload={
    horas:[0,1,2,3,4,5,6].map(function(i){return +fd.get('h'+i)||0}),
    foco:fd.getAll('foco'),
    preservarTreinos:!!fd.get('treinos'),
    observacoes:String(fd.get('obs')||'').slice(0,400),
    diasParaProva:exam?daysBetween(today(),pk(exam)):null,
    areas:R.map(function(r){return {area:r.id,nome:r.nome,indice:r.idx,nivel:LEVELS[r.lvl],motivo:r.why[r.top],cobertura:r.studied+'/'+r.total}}),
    topicosQuentesPendentes:R.reduce(function(a,r){return a.concat(r.hotPending)},[]).slice(0,15),
    treinos:routine.map(function(day){return day.filter(function(b){return b.type!=='estudo'}).map(function(b){return b.type+': '+b.items.join(', ')})}),
    rotinaAtual:routineSummary()
  };
  aiBusy=true;render();
  try{
    var s=(await sb.auth.getSession()).data.session;
    if(!s)throw new Error('Sua sessão expirou. Entre de novo na sua conta.');
    var r=await fetch('/api/plano',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.access_token},body:JSON.stringify(payload)});
    var data=await r.json().catch(function(){return {}});
    if(!r.ok)throw new Error(data.erro||(r.status===404?'A função /api/plano não foi encontrada. Confira se a pasta api foi enviada ao GitHub.':'Erro '+r.status+' ao gerar o plano.'));
    var week=[[],[],[],[],[],[],[]];
    (data.dias||[]).forEach(function(d){
      if(d.dia<0||d.dia>6)return;
      d.blocos.forEach(function(b){week[d.dia].push(B(uid(),TYPES[b.tipo]?b.tipo:'estudo',[b.titulo],b.duracao,SUBJECTS[b.materia]?b.materia:''))});
    });
    if(payload.preservarTreinos){
      week=week.map(function(day,i){
        var keep=routine[i].filter(function(b){return b.type!=='estudo'}).map(function(b){var c=clone(b);c.id=uid();return c});
        var st=day.filter(function(b){return b.type==='estudo'});
        return st.slice(0,1).concat(keep,st.slice(1));
      });
    }
    aiPlan={resumo:data.resumo,dicas:data.dicas||[],week:week};
  }catch(e){aiErr=(e&&e.message)||'Não foi possível gerar o plano.'}
  aiBusy=false;render();
}

var MOTIVOS=[['conteudo','Não sabia o conteúdo'],['esqueci','Esqueci o que já tinha estudado'],['interp','Erro de interpretação'],['tempo','Faltou tempo'],['descuido','Distração ou descuido'],['chute','Chutei']];
var MOTIVO={};MOTIVOS.forEach(function(m){MOTIVO[m[0]]=m[1]});
var MOTIVO_DICA={
 conteudo:'estude na trilha os tópicos desses erros antes de fazer mais questões.',
 esqueci:'faça as revisões de 1, 7 e 30 dias em dia.',
 interp:'treine sublinhar o que o enunciado pede antes de ler as alternativas.',
 tempo:'faça simulados cronometrados e defina um tempo máximo por questão.',
 descuido:'reserve os últimos minutos de cada bloco para conferir as respostas.',
 chute:'marque as questões em que chutou e revise esses tópicos.'
};
var praticaTab=load('praticaTab','erros'),errFilter={mat:'',mot:'',st:'pend'};
function matLabel(id){return MATERIA[id]?MATERIA[id].nome:((SUBJECTS[id]&&SUBJECTS[id].n)||'Outros')}
function hm(m){m=Math.round(m);return Math.floor(m/60)+'h'+pad(m%60)}
function errMaterias(){return MATERIAS.filter(function(m){return m.trilha==='enem'&&m.area!=='red'})}
function errTopicOptions(mat){
  var m=MATERIA[mat],h='<option value="">Sem tópico definido</option>';
  if(m)m.mods.forEach(function(md){h+='<optgroup label="'+esc(md.nome)+'">'+md.ids.map(function(id){return '<option value="'+id+'">'+esc(TOPICS[id].nome)+'</option>'}).join('')+'</optgroup>'});
  return h;
}
function sortedCounts(o){return Object.keys(o).map(function(k){return [k,o[k]]}).sort(function(a,b){return b[1]-a[1]})}
function errStats(days){
  var since=days?dkey(addDays(today(),-(days-1))):'',list=errs.filter(function(e){return !since||e.date>=since});
  var mot={},mat={},top={};
  list.forEach(function(e){
    mot[e.motivo]=(mot[e.motivo]||0)+1;mat[e.mat]=(mat[e.mat]||0)+1;
    if(e.top&&TOPICS[e.top]&&!e.ok)top[e.top]=(top[e.top]||0)+1;
  });
  return {list:list,mot:mot,mat:mat,top:top};
}
function reopenTopic(id){
  var t=TOPICS[id];if(!t)return '';
  var st=topics[id];
  if(!st||st.s===0)return 'Tópico ainda não visto: estude-o na trilha.';
  if(!t.rev)return '';
  if(st.s===3){st.s=2;st.n=Math.min(st.n||0,REV.length-1)}
  st.next=tk();save('topics',topics);
  return 'O tópico volta para revisão hoje.';
}
function mrows(pairs,labelFn,max){
  return pairs.map(function(p){return '<div class="mrow"><span>'+esc(labelFn(p[0]))+'</span><div class="meter"><i style="width:'+Math.round(p[1]/max*100)+'%"></i></div><b>'+p[1]+'</b></div>'}).join('');
}

  }

/* Simulado cronometrado: o tempo entre um "Terminei" e o seguinte vira o tempo da área */
var SIMDEF={
 1:{nome:'1º dia',min:330,qs:90,areas:[['lc','Linguagens',45],['ch','Humanas',45],['red','Redação',0]]},
 2:{nome:'2º dia',min:300,qs:90,areas:[['cn','Natureza',45],['mt','Matemática',45]]}
};
var SIMREDMIN=60;
var simRun=load('sim.run',null);
function simElapsed(r){return Math.max(0,Math.round(((r.fin?r.endAt:Date.now())-r.start)/1000))}
function clockText(s){var a=Math.abs(s);return (s<0?'+':'')+pad(Math.floor(a/3600))+':'+pad(Math.floor(a%3600/60))+':'+pad(a%60)}
function simSegments(r){
  var seg={},prev=0;
  r.cps.forEach(function(c){seg[c.a]=Math.max(0,c.t-prev);prev=c.t});
  return seg;
}
function simRefPace(day,total,redMin){return Math.round(((day===1?total-redMin:total)/SIMDEF[day].qs)*10)/10}
function simTick(){
  if(!simRun||simRun.fin)return;
  var el=simElapsed(simRun),rem=simRun.total*60-el;
  if(rem<=0&&!simRun.beeped){simRun.beeped=true;rawSave('sim.run',simRun);beep();toast('Tempo esgotado. Termine e registre o que fez.')}
  var c=document.getElementById('simClock');if(!c)return;
  c.textContent=clockText(rem);c.classList.toggle('over',rem<0);
  var b=document.getElementById('simBar');if(b)b.style.width=Math.min(100,Math.round(el/(simRun.total*60)*100))+'%';
  var e=document.getElementById('simElapsed');if(e)e.textContent='Decorrido: '+clockText(el);
}
setInterval(simTick,500);

  h+='<p class="hint">No ENEM, o 1º dia tem 90 questões e a redação em 5h30. O 2º dia tem 90 questões em 5h. Ajuste os minutos se a sua prova for diferente.</p>';

  h+='<div class="row2" style="grid-template-columns:1fr 1fr"><label class="f">Duração total (min)<input type="number" name="min" min="30" max="600" value="330" required></label>';
  h+='<label class="f" id="redMinBox">Reservado à redação (min)<input type="number" name="redMin" min="0" max="240" value="'+SIMREDMIN+'"></label></div>';
  h+='<label class="f">Nome (opcional)<input name="nome" maxlength="80" placeholder="Ex.: ENEM 2023, caderno azul"></label>';
  h+='<div><button class="btn" type="submit">Iniciar simulado</button></div></form>';
  h+='<p class="hint" style="margin:10px 0 0">Durante o simulado, toque em "Terminei" ao fechar cada parte da prova. O relógio continua se você trocar de aba ou recarregar a página.</p></div></div>';
  h+='<div class="stack">'+simHistory()+'</div></div>';
  return h;
}
function renderSimRun(){
  var r=simRun,def=SIMDEF[r.day],el=simElapsed(r),rem=r.total*60-el,seg=simSegments(r);
  var h='<div class="two"><div class="stack"><div class="panel simrun"><h3>'+esc(r.nome||('Simulado · '+def.nome))+'</h3>';
  h+='<div class="simclock'+(rem<0?' over':'')+'" id="simClock">'+clockText(rem)+'</div>';
  h+='<div class="progress" role="progressbar" aria-label="Tempo do simulado" style="margin:10px 0 6px"><i id="simBar" style="width:'+Math.min(100,Math.round(el/(r.total*60)*100))+'%"></i></div>';
  h+='<p class="hint" id="simElapsed">Decorrido: '+clockText(el)+'</p>';
  h+='<p class="hint">Ritmo de referência: <b>'+String(simRefPace(r.day,r.total,r.redMin)).replace('.',',')+' min por questão</b> ('+(r.day===1?'tempo total menos a redação, dividido por 90':'tempo total dividido por 90')+').</p>';
  h+='<div class="chips" role="group" aria-label="Partes da prova">';
  def.areas.forEach(function(a){
    if(seg[a[0]]!=null)h+='<span class="chip" aria-pressed="true">'+esc(a[1])+' · '+hm(seg[a[0]]/60).replace('0h','')+(a[2]?' · '+String(Math.round(seg[a[0]]/60/a[2]*10)/10).replace('.',',')+' min/questão':'')+'</span>';
    else h+='<button class="chip" data-act="sim-cp" data-a="'+a[0]+'" aria-pressed="false">Terminei: '+esc(a[1])+'</button>';
  });
  h+='</div><div class="simacts"><button class="btn" data-act="sim-fin">Finalizar simulado</button>';
  if(r.cps.length)h+='<button class="btn ghost" data-act="sim-undo">Desfazer último "Terminei"</button>';
  h+='<button class="btn danger" data-act="sim-cancel">Cancelar</button></div></div></div><div class="stack">'+simHistory()+'</div></div>';
  return h;
}
function renderSimDone(){
  var r=simRun,def=SIMDEF[r.day],seg=simSegments(r),el=simElapsed(r);

function simHistory(){
  var list=sims.filter(function(s){return s.cron}).sort(function(a,b){return a.date<b.date?1:-1});

  if(!list.length)return h+'<p class="empty">Nenhum simulado cronometrado ainda. O resultado mostra em qual parte da prova o tempo se perde.</p></div>';
  list.slice(0,6).forEach(function(s){
    var def=SIMDEF[s.dia]||SIMDEF[1];
    h+='<div class="simcard"><div class="row"><b>'+esc(s.nome)+'</b><span>'+shortDate(s.date)+'</span></div><p class="errmeta">Usou '+hm(s.dur)+' de '+hm(s.total)+(s.ref?' · ritmo de referência '+String(s.ref).replace('.',',')+' min/questão':'')+'</p>';

      var t=s.tempo&&s.tempo[a[0]],v=s[a[0]],pace=t!=null&&a[2]?Math.round(t/a[2]*10)/10:null;

function praticaAction(a,b){
  var id=b.dataset.id;
  if(a==='ptab'){praticaTab=b.dataset.v;rawSave('praticaTab',praticaTab);render();return true}
  if(a==='go-err'){praticaTab='erros';rawSave('praticaTab',praticaTab);go('pratica');return true}
  if(a==='ef-st'){errFilter.st=b.dataset.v;render();return true}
  if(a==='err-ok'||a==='err-open'){
    errs.forEach(function(e){if(e.id===id)e.ok=a==='err-ok'?tk():null});
    save('errors',errs);render();if(a==='err-ok')toast('Erro resolvido');return true;
  }
  if(a==='del-err'){if(!confirm('Apagar este erro do caderno?'))return true;errs=errs.filter(function(e){return e.id!==id});save('errors',errs);render();return true}
  if(a==='sim-cp'&&simRun&&!simRun.fin){
    if(simRun.cps.some(function(c){return c.a===b.dataset.a}))return true;
    simRun.cps.push({a:b.dataset.a,t:simElapsed(simRun)});rawSave('sim.run',simRun);render();return true;
  }
  if(a==='sim-undo'&&simRun&&!simRun.fin){simRun.cps.pop();rawSave('sim.run',simRun);render();return true}
  if(a==='sim-fin'&&simRun&&!simRun.fin){
    var left=SIMDEF[simRun.day].areas.filter(function(x){return !simRun.cps.some(function(c){return c.a===x[0]})}).length;
    if(left&&!confirm('Ainda há '+left+' parte'+(left>1?'s':'')+' sem "Terminei". Finalizar mesmo assim?'))return true;
    simRun.fin=true;simRun.endAt=Date.now();rawSave('sim.run',simRun);render();return true;
  }
  if(a==='sim-cancel'){
    if(!confirm('Descartar este simulado? O tempo e as partes marcadas serão perdidos.'))return true;
    simRun=null;try{localStorage.removeItem(PREFIX+'sim.run')}catch(err){}render();return true;
  }
  return false;
}
function praticaSubmit(f,fd){
  if(f.id==='errForm'){
    var e={id:uid(),date:fd.get('date'),mat:fd.get('errMat'),top:fd.get('top')||'',motivo:fd.get('motivo'),q:String(fd.get('q')||'').trim().slice(0,160),nota:String(fd.get('nota')||'').trim().slice(0,400),ok:null};
    errs.unshift(e);save('errors',errs);
    var msg=reopenTopic(e.top);
    render();toast('Erro registrado. '+msg);return true;
  }
  if(f.id==='simStartForm'){
    var day=+fd.get('day')===2?2:1,total=clamp(fd.get('min'),30,600)||SIMDEF[day].min,red=day===1?(clamp(fd.get('redMin'),0,240)||0):0;
    simRun={day:day,nome:String(fd.get('nome')||'').trim().slice(0,80),start:Date.now(),total:total,redMin:red,cps:[],fin:false};
    rawSave('sim.run',simRun);render();return true;
  }
  if(f.id==='simDoneForm'&&simRun&&simRun.fin){
    var r=simRun,def=SIMDEF[r.day],seg=simSegments(r);
    var x={id:uid(),date:dkey(new Date(r.start)),nome:r.nome||('Simulado cronometrado · '+def.nome),cron:true,dia:r.day,dur:Math.round(simElapsed(r)/60),total:r.total,ref:simRefPace(r.day,r.total,r.redMin),tempo:{}};
    def.areas.forEach(function(a){
      x[a[0]]=clamp(fd.get(a[0]),0,a[0]==='red'?1000:45);
      if(seg[a[0]]!=null)x.tempo[a[0]]=Math.round(seg[a[0]]/60);
    });
    sims.push(x);save('sims',sims);
    simRun=null;try{localStorage.removeItem(PREFIX+'sim.run')}catch(err){}
    render();toast('Simulado salvo');return true;
  }
  return false;
}
function praticaChange(el){
  if(el.name==='errMat'){var t=document.getElementById('errTop');if(t)t.innerHTML=errTopicOptions(el.value);return true}
  if(el.dataset.ef){errFilter[el.dataset.ef]=el.value;render();return true}
  if(el.name==='day'&&el.form&&el.form.id==='simStartForm'){
    var d=+el.value===2?2:1;el.form.min.value=SIMDEF[d].min;
    var bx=document.getElementById('redMinBox');if(bx){bx.style.display=d===1?'':'none';el.form.redMin.value=d===1?SIMREDMIN:0}
    return true;
  }
  return false;
}

function recordFocus(min){
  if(!(min>=1))return;
  var k=tk(),s=(T&&T.subj)||'outros';
  focus[k]=(focus[k]||0)+min;save('focus',focus);
  hoursBy[k]=hoursBy[k]||{};hoursBy[k][s]=(hoursBy[k][s]||0)+min;save('hours',hoursBy);
}
function bumpLog(f,n){var k=tk();daylog[k]=daylog[k]||{};daylog[k][f]=(daylog[k][f]||0)+(n||1);save('daylog',daylog)}
function hoursByMat(days){
  var o={},from=addDays(today(),-(days-1));
  for(var i=0;i<days;i++){var h=hoursBy[dkey(addDays(from,i))];if(h)Object.keys(h).forEach(function(m){o[m]=(o[m]||0)+h[m]})}
  return o;
}
function plannedMinutes(){var t=0;routine.forEach(function(day){day.forEach(function(b){if(b.type==='estudo')t+=parseDur(b.time)*60})});return t}
function weekMetrics(){
  var mon=mondayOf(new Date()),mk=dkey(mon),m=0,r=0,t=0;
  for(var i=0;i<7;i++){var k=dkey(addDays(mon,i));m+=focus[k]||0;r+=(daylog[k]&&daylog[k].r)||0}
  Object.keys(topics).forEach(function(id){var s=topics[id];if(s&&s.at&&s.at>=mk)t++});
  return {h:m/60,t:t,r:r};
}

/* =========================================================
   HÁBITOS: ÁGUA E HÁBITO A LARGAR
   Água sincroniza como o resto da rotina.
   O registro do hábito fica só neste aparelho, a menos que a pessoa ative a sincronização.
   ========================================================= */
var WATER_QUICK=[200,300,500];
function waterGoalMl(){var g=parseInt(waterGoal,10);return g>=500&&g<=6000?g:2000}
function waterMl(k){var x=water[k];return x&&x.ml>0?x.ml:0}
function fmtMl(ml){ml=Math.round(ml);return ml>=1000?(Math.round(ml/100)/10).toLocaleString('pt-BR')+' L':ml+' ml'}
function waterAdd(ml){
  ml=parseInt(ml,10);if(!(ml>=50&&ml<=2000))return false;
  var k=tk(),x=water[k];if(!x||!x.adds)x=water[k]={ml:0,adds:[]};
  x.ml+=ml;x.adds.push(ml);save('water',water);return true;
}
function waterUndo(){
  var k=tk(),x=water[k];if(!x||!x.adds||!x.adds.length)return false;
  x.ml-=x.adds.pop();if(!x.adds.length||x.ml<=0)delete water[k];
  save('water',water);return true;
}
function waterHit(k){return waterMl(k)>=waterGoalMl()}
function waterStreak(){
  var d=today(),n=0;
  if(!waterHit(dkey(d)))d=addDays(d,-1);          // hoje ainda pode bater a meta
  while(waterHit(dkey(d))){n++;d=addDays(d,-1)}
  return n;
}
function waterBestRun(){
  var ks=Object.keys(water).filter(waterHit).sort(),best=0,run=0,prev=null;
  ks.forEach(function(k){run=prev&&daysBetween(pk(prev),pk(k))===1?run+1:1;if(run>best)best=run;prev=k});
  return best;
}
function waterPanel(full){
  var g=waterGoalMl(),k=tk(),ml=waterMl(k),p=Math.min(100,Math.round(ml/g*100)),x=water[k];
  var h='<div class="panel"><h3>Água de hoje</h3>';
  h+='<p class="bignum">'+fmtMl(ml)+' <small>de '+fmtMl(g)+' · '+p+'%</small></p>';
  h+='<div class="progress" role="progressbar" aria-label="Água de hoje" aria-valuenow="'+p+'" aria-valuemin="0" aria-valuemax="100" style="margin-bottom:12px"><i style="width:'+p+'%;background:var(--est)"></i></div>';
  if(ml>=g)h+='<div class="allgood">Meta de água de hoje batida.</div>';
  h+='<div class="chips" role="group" aria-label="Registrar água">'+WATER_QUICK.map(function(v){return '<button class="chip" data-act="w-add" data-ml="'+v+'">+ '+v+' ml</button>'}).join('');
  if(x&&x.adds&&x.adds.length)h+='<button class="chip" data-act="w-undo">Desfazer último</button>';
  h+='</div>';
  if(!full)return h+'<button class="link no-print" data-act="go" data-v="habitos" style="margin-top:10px">Histórico e meta de água</button></div>';

  h+='<form class="form" id="waterForm" style="margin-top:12px"><div class="row2"><label class="f">Outra quantidade (ml)<input type="number" name="ml" inputmode="numeric" min="50" max="2000" step="10" placeholder="Ex.: 350" required></label><div style="align-self:end"><button class="btn sm" type="submit">Adicionar</button></div></div></form>';
  var mx=g,sum=0,days=0,i;
  for(i=0;i<7;i++){var v0=waterMl(dkey(addDays(today(),-i)));if(v0>mx)mx=v0;if(v0){sum+=v0;days++}}
  h+='<h4 class="sub">Últimos 7 dias</h4><div class="bars" style="height:150px" role="img" aria-label="Água por dia nos últimos 7 dias">';
  for(i=6;i>=0;i--){
    var d=addDays(today(),-i),v=waterMl(dkey(d));
    h+='<div class="bar'+(v>=g?' cur':'')+'"><b>'+(v?fmtMl(v):'')+'</b><i style="height:'+Math.max(2,Math.round(v/mx*62))+'%"></i><small>'+SHORT[dayIdx(d)]+'</small></div>';
  }
  h+='</div><p class="hint" style="margin:8px 0 0">Barra verde é dia com a meta batida.</p>';
  h+='<div class="split" style="margin-top:12px"><div class="row"><span>Dias seguidos com a meta</span><span>'+waterStreak()+'</span></div>';
  h+='<div class="row"><span>Média nos dias registrados (7 dias)</span><span>'+(days?fmtMl(sum/days):'sem registros')+'</span></div></div>';
  h+='<form class="form" id="waterGoalForm" style="margin-top:14px"><div class="row2"><label class="f">Meta diária (ml)<input type="number" name="goal" inputmode="numeric" min="500" max="6000" step="50" value="'+g+'" required></label><div style="align-self:end"><button class="btn sm ghost" type="submit">Salvar meta</button></div></div></form>';
  h+='<p class="hint" style="margin:10px 0 0">2 L é só um ponto de partida. A necessidade de água varia de pessoa para pessoa; em caso de dúvida, converse com um profissional de saúde.</p>';
  return h+'</div>';
}

/* ---- Hábito a largar (registro privado) ---- */
var HAB_GATILHOS=['Tédio','Cansaço','Estresse ou ansiedade','Noite','Celular ou redes sociais','Conteúdo adulto','Outro'];
var HAB_MARCOS=[3,7,14,30,60,90,180,365];
var HAB_PLANO=['Beber um copo de água','Sair do lugar e andar 5 minutos','Fazer um foco de 25 minutos de estudo','Falar com alguém de confiança'];
function habNome(){return habit&&habit.name?habit.name:'Hábito a largar'}
function habSave(){save('habit',habit)}
function habFix(){
  if(!habit)return;
  habit.rel=habit.rel||[];habit.urges=habit.urges||{};
  habit.rel.forEach(function(r){if(r.date<habit.start)habit.start=r.date});
}
function habRel(){return (habit&&habit.rel||[]).slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0})}
function habRef(){var r=habRel(),ref=habit.start;if(r.length&&r[r.length-1].date>ref)ref=r[r.length-1].date;return ref}
function habDays(){return Math.max(0,daysBetween(pk(habRef()),today()))}
function habBest(){
  var pts=[habit.start].concat(habRel().map(function(r){return r.date})),best=0;
  for(var i=1;i<pts.length;i++)best=Math.max(best,daysBetween(pk(pts[i-1]),pk(pts[i])));
  return Math.max(best,habDays());
}
function habCount(from,to){
  return habRel().filter(function(r){var a=daysBetween(pk(r.date),today());return a>=from&&a<=to}).length;
}
function habTriggers(){
  var c={};habRel().forEach(function(r){(r.g||[]).forEach(function(g){c[g]=(c[g]||0)+1})});
  return sortedCounts(c);
}
function habPlan(){return habit&&habit.plan&&habit.plan.length?habit.plan:HAB_PLANO}
function habUrges30(){
  var n=0,u=habit.urges||{};
  for(var i=0;i<30;i++)n+=u[dkey(addDays(today(),-i))]||0;
  return n;
}
function syncHabitKey(){
  var i=KEYS.indexOf('habit'),on=load('habitSync',false)===true;
  if(on&&i<0)KEYS.push('habit');
  if(!on&&i>=0)KEYS.splice(i,1);
}

function habOnboard(){
  var h='<form class="panel form" id="habStartForm"><h3>Hábito a largar</h3>';
  h+='<p class="hint" style="margin:0">Um registro privado para acompanhar os dias sem recaída, os gatilhos e as vontades que você deixou passar. Fica salvo só neste aparelho: não entra no backup comum, não vai para a nuvem e não aparece no Hoje, no Progresso nem nas conquistas.</p>';
  h+='<label class="f">Nome que aparece na tela (opcional)<input name="name" maxlength="40" placeholder="Hábito a largar"></label>';
  h+='<label class="f">Começar a contar em<input type="date" name="start" value="'+tk()+'" max="'+tk()+'" required></label>';
  return h+'<div><button class="btn" type="submit">Começar a contar</button></div></form>';
}
function habCounterPanel(){
  var d=habDays(),best=habBest(),uToday=(habit.urges||{})[tk()]||0,nx=0;
  HAB_MARCOS.some(function(m){if(m>d){nx=m;return true}return false});
  var h='<div class="panel"><h3>'+esc(habNome())+'</h3>';
  h+='<p class="bignum">'+d+' <small>'+(d===1?'dia sem recaída':'dias sem recaída')+'</small></p>';
  if(nx){
    var pc=Math.round(d/nx*100);
    h+='<div class="progress thin" role="progressbar" aria-label="Caminho até a próxima marca" aria-valuenow="'+pc+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+pc+'%"></i></div>';
    h+='<p class="hint" style="margin:8px 0 0">'+(d===0?'A contagem recomeça hoje. ':'')+'Próxima marca: '+nx+' dias (faltam '+(nx-d)+').</p>';
  }else h+='<p class="hint" style="margin:8px 0 0">Você passou de todas as marcas, até 1 ano.</p>';
  var got=HAB_MARCOS.filter(function(m){return m<=best});
  if(got.length)h+='<p style="margin:12px 0 0">'+got.map(function(m){return '<span class="tag ok">'+m+' dias</span>'}).join('')+'</p>';
  h+='<div class="split" style="margin-top:14px"><div class="row"><span>Melhor sequência</span><span>'+best+(best===1?' dia':' dias')+'</span></div>';
  h+='<div class="row"><span>Recaídas nos últimos 30 dias</span><span>'+habCount(0,29)+'</span></div>';
  h+='<div class="row"><span>Vontades que passaram (30 dias)</span><span>'+habUrges30()+'</span></div></div>';
  h+='<div class="row" style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="h-urge">Resisti a uma vontade</button>';
  if(uToday)h+='<button class="btn ghost" data-act="h-urge-undo">Desfazer</button>';
  h+='</div><p class="hint" style="margin:10px 0 0">'+(uToday?'Hoje: '+uToday+(uToday===1?' vontade que passou.':' vontades que passaram.'):'Toda vez que a vontade vier e passar sem recaída, registre aqui. Isso também conta.')+'</p></div>';
  return h;
}
function habRelapsePanel(){
  var h='<form class="panel form" id="habRelForm"><h3>Registrar uma recaída</h3>';
  h+='<p class="hint" style="margin:0">Uma recaída não apaga seu histórico. Registrar o que estava acontecendo ajuda a enxergar o padrão.</p>';
  h+='<label class="f">Data<input type="date" name="date" value="'+tk()+'" max="'+tk()+'" required></label>';
  h+='<div><span class="lbl" style="font-size:13px;font-weight:700;color:var(--ink-soft)">O que estava por trás? (opcional)</span><div class="chips" style="margin-top:6px">';
  HAB_GATILHOS.forEach(function(g){h+='<label class="chip"><input type="checkbox" name="g" value="'+esc(g)+'">'+esc(g)+'</label>'});

      h+='<div class="acts"><button type="button" class="btn sm ghost" data-act="h-delrel" data-id="'+esc(r.id)+'">Apagar</button></div></li>';

  return h+'</form>';

function habPatternsPanel(){
  var h='<div class="panel"><h3>Padrões</h3>',rel=habRel();
  if(!rel.length)return h+'<p class="empty">Nenhuma recaída registrada. Se acontecer, os gatilhos que você marcar aparecem aqui.</p></div>';
  var a=habCount(0,29),span=daysBetween(pk(habit.start),today());
  h+='<div class="split"><div class="row"><span>Últimos 30 dias</span><span>'+a+(a===1?' recaída':' recaídas')+'</span></div>';
  if(span>=60){          // só compara quando já existem 60 dias de histórico
    var b=habCount(30,59);
    h+='<div class="row"><span>30 dias anteriores</span><span>'+b+(b===1?' recaída':' recaídas')+'</span></div></div>';
    h+='<p class="hint" style="margin:8px 0 0">'+(a<b?'Menos recaídas que no período anterior.':a===b?'Mesmo número do período anterior.':'Mais recaídas que no período anterior. Isso acontece; olhe os gatilhos abaixo.')+'</p>';
  }else h+='</div>';
  var tg=habTriggers();
  if(tg.length){
    h+='<h4 class="sub">Gatilhos mais frequentes</h4>'+tg.slice(0,5).map(function(p){
      return '<div class="mrow"><span>'+esc(p[0])+'</span><div class="meter"><i style="width:'+Math.round(p[1]/tg[0][1]*100)+'%"></i></div><b style="min-width:28px">'+p[1]+'</b></div>';
    }).join('');
  }
  return h+'</div>';
}
function habHeatPanel(){
  var rd={};habRel().forEach(function(r){rd[r.date]=(rd[r.date]||0)+1});
  var t=today(),start=addDays(mondayOf(t),-77);
  var h='<div class="panel"><h3>Últimas 12 semanas</h3><div class="heat" role="img" aria-label="Dias sem recaída e dias com recaída nas últimas 12 semanas">';
  for(var k=0;k<84;k++){
    var d=addDays(start,k),key=dkey(d),c='',tt=fmt(d,{weekday:'short',day:'numeric',month:'short'});
    if(d>t||key<habit.start)c='fut';
    else if(rd[key]){c='rel';tt+=' · recaída'}
    else{c='l3';tt+=' · sem recaída'}
    h+='<div class="'+c+'" title="'+tt+'"></div>';
  }
  return h+'</div><p class="hint" style="margin:8px 0 0">Cada linha é uma semana, de segunda a domingo. Verde é dia sem recaída; vermelho com × é dia com recaída.</p></div>';
}
function habPlanPanel(){
  var h='<div class="panel"><h3>Quando bater a vontade</h3>';

function habAction(a,b){
  if(a==='w-add'||a==='h-water'){
    var ml=a==='h-water'?200:+b.dataset.ml,g=waterGoalMl(),was=waterMl(tk());
    if(waterAdd(ml)){render();toast(was<g&&waterMl(tk())>=g?'Meta de água de hoje batida!':'+ '+ml+' ml de água')}
    return true;
  }
  if(a==='w-undo'){waterUndo();render();return true}
  if(a==='h-focus'){startTimer('Foco: deixando a vontade passar','');toast('Foco de 25 minutos iniciado');return true}
  if(!/^h-/.test(a))return false;
  if(a==='h-sync'){
    var on=b.dataset.on==='1';
    if(on&&!confirm('Ativar a sincronização envia este registro para a sua conta, junto com o resto da rotina. Quem administra o banco de dados do site consegue ler esses dados.\n\nContinuar?'))return true;
    save('habitSync',on);syncHabitKey();
    if(on&&habit)markDirty();
    render();toast(on?'Sincronização do hábito ativada':'Este registro voltou a ficar só neste aparelho');return true;
  }
  if(a==='h-del'){
    if(!habit||!confirm('Apagar todo o registro deste hábito? Isso não pode ser desfeito.'))return true;
    habit=null;try{localStorage.removeItem(PREFIX+'habit')}catch(err){}
    if(KEYS.indexOf('habit')>=0)markDirty();
    render();toast('Registro apagado');return true;
  }
  if(!habit)return true;
  if(a==='h-urge'){
    var k=tk();habit.urges[k]=(habit.urges[k]||0)+1;habSave();render();toast('Mais uma vontade que passou');return true;
  }
  if(a==='h-urge-undo'){
    var k2=tk();if(habit.urges[k2]){habit.urges[k2]--;if(habit.urges[k2]<=0)delete habit.urges[k2];habSave();render()}return true;
  }
  if(a==='h-delrel'){
    if(!confirm('Apagar este registro?'))return true;
    habit.rel=habit.rel.filter(function(r){return r.id!==b.dataset.id});habSave();render();return true;
  }
  return true;
}
function habSubmit(f,fd){
  if(f.id==='waterForm'){
    var ml=parseInt(fd.get('ml'),10);
    if(!(ml>=50&&ml<=2000)){toast('Informe de 50 a 2000 ml');return true}
    var g=waterGoalMl(),was=waterMl(tk());waterAdd(ml);render();
    toast(was<g&&waterMl(tk())>=g?'Meta de água de hoje batida!':'+ '+ml+' ml de água');return true;
  }
  if(f.id==='waterGoalForm'){
    var gl=parseInt(fd.get('goal'),10);
    if(!(gl>=500&&gl<=6000)){toast('Informe uma meta entre 500 e 6000 ml');return true}
    waterGoal=Math.round(gl/50)*50;save('waterGoal',waterGoal);render();toast('Meta de água salva');return true;
  }
  if(f.id==='habStartForm'){
    var st=String(fd.get('start')||'');
    if(!/^\d{4}-\d{2}-\d{2}$/.test(st)||st>tk()){toast('Escolha uma data de hoje ou anterior');return true}
    habit={name:String(fd.get('name')||'').trim().slice(0,40),start:st,rel:[],urges:{},plan:null};
    habSave();render();toast('Contagem iniciada');return true;
  }
  if(!habit)return false;
  if(f.id==='habRelForm'){
    var dt=String(fd.get('date')||'');
    if(!/^\d{4}-\d{2}-\d{2}$/.test(dt)||dt>tk()){toast('Escolha uma data de hoje ou anterior');return true}
    var gs=fd.getAll('g').filter(function(x){return HAB_GATILHOS.indexOf(x)>=0});
    habit.rel.push({id:uid(),date:dt,g:gs,n:String(fd.get('n')||'').trim().slice(0,300)});
    habFix();habSave();render();toast('Registrado. Uma recaída não apaga o que você já construiu.');return true;
  }
  if(f.id==='habPlanForm'){
    var lines=String(fd.get('plan')||'').split('\n').map(function(s){return s.trim().slice(0,80)}).filter(Boolean).slice(0,8);
    habit.plan=lines.length?lines:null;habSave();render();toast('Plano salvo');return true;
  }
  if(f.id==='habCfgForm'){
    var s2=String(fd.get('start')||'');
    if(!/^\d{4}-\d{2}-\d{2}$/.test(s2)||s2>tk()){toast('Escolha uma data de hoje ou anterior');return true}
    habit.name=String(fd.get('name')||'').trim().slice(0,40);habit.start=s2;
    habFix();habSave();render();toast('Salvo');return true;
  }
  return false;
}

    var ins=document.querySelectorAll('[data-f="items"][data-day="'+day+'"]');if(ins.length){ins[ins.length-1].focus();ins[ins.length-1].select()}}
  else if(a==='del'){if(!confirm('Remover este bloco?'))return;routine[day].splice(i,1);saveRoutine();render()}

  else if(a==='down'&&i<routine[day].length-1){var r2=routine[day];r2.splice(i+1,0,r2.splice(i,1)[0]);saveRoutine();render()}

  if(el.dataset.f&&el.tagName==='SELECT'){routine[+el.dataset.day][+el.dataset.i][el.dataset.f]=el.value;saveRoutine();renderStats()}
});
main.addEventListener('submit',function(e){

  if(f.id==='aiForm'){if(!aiBusy)generatePlan(f);return}

  }
