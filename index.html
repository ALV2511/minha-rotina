function exportData(){
  var data={app:'minha-rotina',versao:2,exportadoEm:new Date().toISOString()};
  KEYS.forEach(function(k){data[k]=load(k,null)});
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rotina-backup-'+tk()+'.json';
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
  toast('Backup baixado');
}
document.getElementById('importFile').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var d=JSON.parse(rd.result);if(d.app!=='minha-rotina')throw 0;
      if(d.versao===1){d['routine.v2']=null}            // backup antigo: mantém a rotina nova, importa marcações
      if(!confirm('Substituir os dados deste aparelho pelo backup?'))return;
      if(d.habitSync===true){rawSave('habitSync',true);syncHabitKey()}
      KEYS.forEach(function(k){if(d[k]!=null)save(k,d[k])});
      location.reload();
    }catch(err){toast('Arquivo inválido. Use um backup baixado por este site.')}
  };
  rd.readAsText(f);e.target.value='';
});

/* =========================================================
   CRONÔMETRO DE FOCO (25/5, pausa longa a cada 4)
   ========================================================= */
var T={mode:'foco',end:0,left:25*60,running:false,label:'',subj:'',skipRec:false,int:null,count:0};
var DUR={foco:25*60,pausa:5*60,longa:15*60};
var tEl=document.getElementById('timer');
function tDraw(){
  var s=Math.max(0,Math.round(T.running?(T.end-Date.now())/1000:T.left));
  var txt=pad(Math.floor(s/60))+':'+pad(s%60);
  document.getElementById('tClock').textContent=txt;
  document.getElementById('tLabel').textContent=T.label||'Foco';
  document.getElementById('tMode').textContent=(T.mode==='foco'?'Foco':T.mode==='pausa'?'Pausa curta':'Pausa longa')+' · ciclos concluídos: '+T.count;
  document.getElementById('tPlay').textContent=T.running?'Pausar':'Continuar';
  document.title=T.running?txt+' · Minha Rotina':'Minha Rotina';
  if(T.running&&s<=0)tFinish();
}
function focusElapsed(){
  if(T.mode!=='foco')return 0;
  var left=T.running?Math.max(0,(T.end-Date.now())/1000):T.left;
  return Math.max(0,Math.round((DUR.foco-left)/60));
}
function startTimer(label,subj){T.label=label;T.subj=subj||'';T.mode='foco';T.left=DUR.foco;T.running=true;T.end=Date.now()+T.left*1000;tEl.hidden=false;tTick();tDraw()}
function tTick(){clearInterval(T.int);T.int=setInterval(tDraw,500)}
function beep(){try{var c=new (window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(function(t){var o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.2,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+.2);o.start(c.currentTime+t);o.stop(c.currentTime+t+.22)})}catch(e){}}
function tFinish(){
  beep();
  if(T.mode==='foco'){T.count++;var k=tk();if(T.skipRec)T.skipRec=false;else recordFocus(25);T.mode=T.count%4===0?'longa':'pausa';toast('Foco concluído. Hora da pausa.')}
  else{T.mode='foco';toast('Pausa encerrada. Bora pro próximo foco.')}
  T.left=DUR[T.mode];T.end=Date.now()+T.left*1000;
}
document.getElementById('tPlay').onclick=function(){
  if(T.running){T.left=Math.max(0,(T.end-Date.now())/1000);T.running=false}
  else{T.end=Date.now()+T.left*1000;T.running=true;tTick()}
  tDraw();
};
document.getElementById('tSkip').onclick=function(){if(T.mode==='foco'){recordFocus(focusElapsed());T.skipRec=true}T.running=true;T.end=Date.now();tDraw()};
document.getElementById('tReset').onclick=function(){if(T.mode==='foco')recordFocus(focusElapsed());T.left=DUR[T.mode];T.running=false;tDraw()};
document.getElementById('tClose').onclick=function(){if(T.mode==='foco')recordFocus(focusElapsed());T.left=DUR[T.mode];clearInterval(T.int);T.running=false;tEl.hidden=true;document.title='Minha Rotina'};

/* =========================================================
   SINCRONIZAÇÃO COM O SUPABASE
   Guarda tudo numa linha da tabela rotina_dados (uma por usuário).
   O aparelho continua salvando localmente; a nuvem recebe uma cópia
   1,5 s depois de cada mudança e é consultada ao abrir o site.
   ========================================================= */
var TABLE='rotina_dados',sb=null,user=null,syncState='off',syncMsg='',pushT=null,gen=0,recovering=false,busyReconcile=false;
function meta(k,d){return load('sync.'+k,d)}
function setMeta(k,v){rawSave('sync.'+k,v)}
function markDirty(){gen++;setMeta('dirty',true);if(user){clearTimeout(pushT);pushT=setTimeout(push,1500);setSync('busy')}}
var SLABEL={off:'Só neste aparelho',out:'Entrar',ok:'Salvo na nuvem',busy:'Salvando...',err:'Nuvem indisponível'};
function setSync(s,msg){syncState=s;syncMsg=msg||'';drawSync()}
function drawSync(){
  var d=document.getElementById('syncDot');d.className='dot'+(syncState==='ok'?' ok':syncState==='busy'?' busy':syncState==='err'?' err':'');
  document.getElementById('syncTxt').textContent=SLABEL[syncState];
  document.getElementById('syncBtn').title=syncMsg||SLABEL[syncState];
  var st=document.getElementById('syncStatus');if(st)st.textContent=SLABEL[syncState]+(syncMsg?': '+syncMsg:'');
  var la=document.getElementById('syncAt');if(la)la.textContent=lastSyncText();
}
function lastSyncText(){var a=meta('at','');return a?new Date(a).toLocaleString('pt-BR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'nunca'}
function errText(e){
  var m=(e&&e.message)||String(e);
  if(/fetch|network|load failed/i.test(m))return 'sem conexão ou projeto do Supabase pausado';
  if(/relation|does not exist|schema cache/i.test(m))return 'tabela rotina_dados não encontrada, rode o SQL de configuração';
  if(/row-level security|permission/i.test(m))return 'sem permissão, confira as regras (RLS) do SQL de configuração';
  return m;
}
function collect(){var o={};KEYS.forEach(function(k){var v=load(k,undefined);if(v!==undefined)o[k]=v});return o}
function hasLocalData(){
  return KEYS.some(function(k){
    var v=load(k,null);if(v==null||k==='best'||k==='exam')return false;
    if(k==='routine.v2')return true;
    if(Array.isArray(v))return v.length>0;
    return typeof v==='object'?Object.keys(v).length>0:!!v;
  });
}
function adopt(r){
  var d=r.dados||{};
  rawSave('habitSync',d.habitSync===true);syncHabitKey();     // a nuvem decide se o registro do hábito acompanha a conta
  KEYS.forEach(function(k){if(d[k]!=null)rawSave(k,d[k]);else{try{localStorage.removeItem(PREFIX+k)}catch(e){}}});
  setMeta('at',r.atualizado_em);setMeta('dirty',false);
  reloadState();render();setSync('ok');
}
function newer(a,b){return new Date(a||0).getTime()>new Date(b||0).getTime()}
async function push(){
  if(!user)return;
  var g=gen;setSync('busy');
  try{
    var res=await sb.from(TABLE).upsert({user_id:user.id,dados:collect()},{onConflict:'user_id'}).select('atualizado_em').single();
    if(res.error)throw res.error;
    setMeta('at',res.data.atualizado_em);
    if(g===gen)setMeta('dirty',false);
    setSync('ok');
  }catch(e){setSync('err',errText(e))}
}
async function reconcile(){
  if(!user||busyReconcile)return;busyReconcile=true;setSync('busy');
  try{
    var res=await sb.from(TABLE).select('dados,atualizado_em').eq('user_id',user.id).maybeSingle();
    if(res.error)throw res.error;
    var r=res.data,lastUid=meta('uid',''),at=meta('at',''),dirty=meta('dirty',false);
    if(!r){setMeta('uid',user.id);await push();return}             // primeira vez: envia o que existe aqui
    if(lastUid!==user.id){
      setMeta('uid',user.id);
      if(!lastUid&&hasLocalData()&&!confirm('Esta conta já tem dados salvos na nuvem.\n\nOK: usar os dados da nuvem neste aparelho.\nCancelar: substituir a nuvem pelos dados deste aparelho.')){await push();return}
      adopt(r);return;
    }
    if(newer(r.atualizado_em,at)){
      if(dirty&&!confirm('Houve mudanças em outro aparelho e também neste.\n\nOK: ficar com a versão da nuvem.\nCancelar: ficar com a versão deste aparelho.')){await push();return}
      adopt(r);return;
    }
    if(dirty){await push();return}
    setSync('ok');
  }catch(e){setSync('err',errText(e))}
  finally{busyReconcile=false}
}
function initSync(){
  if(!SUPABASE_URL||!SUPABASE_KEY){setSync('off');return}
  if(!window.supabase){setSync('err','não foi possível carregar a biblioteca do Supabase');return}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  setSync('out');
  sb.auth.onAuthStateChange(function(ev,session){
    var u=session?session.user:null;
    if(ev==='PASSWORD_RECOVERY'){recovering=true;view='conta'}
    if(u&&(!user||user.id!==u.id)){user=u;setTimeout(reconcile,0)}
    else if(!u){user=null;setSync('out')}
    if(view==='conta')render();
  });
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&user)reconcile()});
  setInterval(function(){if(user&&syncState==='err')reconcile()},60000);
}

/* Tela: Conta */
function renderConta(){
  var h='<div class="account stack">';
  if(!SUPABASE_URL||!SUPABASE_KEY){
    h+='<div class="panel"><h3>Salvar na nuvem</h3><p class="hint">A sincronização ainda não foi configurada. Seus dados estão salvos só neste aparelho.</p><p class="hint" style="margin:0">Para ativar, preencha <b>SUPABASE_URL</b> e <b>SUPABASE_KEY</b> no início do arquivo index.html e suba de novo no GitHub.</p></div>';
  }else if(!sb){
    h+='<div class="panel"><h3>Salvar na nuvem</h3><div class="msg err">Não foi possível carregar o Supabase. Confira sua internet e recarregue a página.</div></div>';
  }else if(recovering){
    h+='<div class="panel"><h3>Criar nova senha</h3><form class="form" id="pwForm"><label class="f">Nova senha<input type="password" name="pw" minlength="6" autocomplete="new-password" required></label><div><button class="btn" type="submit">Salvar nova senha</button></div></form><div id="authMsg"></div></div>';
  }else if(user){
    h+='<div class="panel"><h3>Sua conta</h3>';
    h+='<div class="kv"><span>E-mail</span><span>'+esc(user.email)+'</span></div>';
    h+='<div class="kv"><span>Status</span><span id="syncStatus"></span></div>';
    h+='<div class="kv"><span>Última sincronização</span><span id="syncAt"></span></div>';
    h+='<div class="row" style="margin-top:14px"><button class="btn" data-act="sync-now">Sincronizar agora</button><button class="btn ghost" data-act="logout">Sair</button></div>';
    h+='<p class="hint" style="margin:14px 0 0">Se o status ficar como "Nuvem indisponível" por vários dias, o Supabase pausou seu projeto por falta de uso. Reative no painel do Supabase e volte para a rotina. Enquanto isso, tudo continua salvo neste aparelho.</p></div>';
  }else{
    h+='<div class="panel"><h3>Entrar</h3><p class="hint" style="margin:0">Entre para salvar sua rotina na nuvem e usar os mesmos dados no celular e no computador.</p>';
    h+='<form class="form" id="authForm"><label class="f">E-mail<input type="email" name="email" autocomplete="email" required></label>';
    h+='<label class="f">Senha<input type="password" name="pw" minlength="6" autocomplete="current-password" required></label>';
    h+='<div class="row"><button class="btn" type="submit">Entrar</button><button class="btn ghost" type="button" data-act="signup">Criar conta</button><button class="link" type="button" data-act="forgot">Esqueci a senha</button></div></form><div id="authMsg"></div></div>';
  }
  h+=installPanel();
  return h+'</div>';
}
function isStandalone(){return window.navigator.standalone===true||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)}
function installPanel(){
  var h='<div class="panel" id="installPanel"><h3>Instalar no iPhone</h3>';
  if(isStandalone())return h+'<p class="hint" style="margin:0">Você está usando o app instalado. Mantenha o login ativo acima para os dados sincronizarem com seus outros aparelhos.</p></div>';
  h+='<ol class="plan"><li>Abra este site no <b>Safari</b>.</li><li>Toque em <b>Compartilhar</b> (o quadrado com a seta) e depois em <b>Adicionar à Tela de Início</b>. Em alguns iOS essa opção fica em "Ver mais".</li><li>Abra o app pelo ícone novo, não pelo Safari.</li></ol>';
  h+='<p class="hint" style="margin:12px 0 0">O app instalado guarda os dados <b>separados do Safari</b>. Entre na sua conta dentro dele para a rotina sincronizar. O registro do hábito não sincroniza por padrão: ative a sincronização em Hábitos, Configurações deste registro, ou comece o registro direto no app instalado.</p></div>';
  return h;
}
function authMsg(t,ok){var m=document.getElementById('authMsg');if(m)m.innerHTML='<div class="msg '+(ok?'ok':'err')+'">'+esc(t)+'</div>'}
function authErr(e){
  var m=(e&&e.message)||'';
  if(/invalid login/i.test(m))return 'E-mail ou senha incorretos.';
  if(/not confirmed/i.test(m))return 'Confirme seu e-mail pelo link que enviamos antes de entrar.';
  if(/already registered|already exists/i.test(m))return 'Este e-mail já tem conta. Use Entrar.';
  if(/password/i.test(m)&&/6/.test(m))return 'A senha precisa ter pelo menos 6 caracteres.';
  if(/rate limit/i.test(m))return 'Muitas tentativas seguidas. Espere alguns minutos e tente de novo.';
  return errText(e);
}
function formVals(){var f=document.getElementById('authForm');return f?{email:f.email.value.trim(),pw:f.pw.value,form:f}:null}
var HERE=location.origin+location.pathname;
main.addEventListener('click',async function(e){
  var b=e.target.closest('[data-act]');if(!b||!sb)return;
  var a=b.dataset.act;
  if(a==='signup'){
    var v=formVals();if(!v.form.reportValidity())return;
    var r=await sb.auth.signUp({email:v.email,password:v.pw,options:{emailRedirectTo:HERE}});
    if(r.error)return authMsg(authErr(r.error));
    if(!r.data.session)authMsg('Conta criada. Abra o link de confirmação que enviamos para '+v.email+' e depois entre aqui.',true);
  }else if(a==='forgot'){
    var v2=formVals();if(!v2.email){authMsg('Digite seu e-mail no campo acima e clique de novo em Esqueci a senha.');return}
    var r2=await sb.auth.resetPasswordForEmail(v2.email,{redirectTo:HERE});
    if(r2.error)return authMsg(authErr(r2.error));
    authMsg('Enviamos um link para criar uma nova senha em '+v2.email+'.',true);
  }else if(a==='logout'){
    await sb.auth.signOut();user=null;setMeta('uid','');setMeta('at','');setSync('out');render();toast('Você saiu. Os dados continuam neste aparelho.');
  }else if(a==='sync-now'){await reconcile();if(syncState==='ok')toast('Sincronizado')}
});
main.addEventListener('submit',async function(e){
  var f=e.target;if(!sb)return;
  if(f.id==='authForm'){
    var r=await sb.auth.signInWithPassword({email:f.email.value.trim(),password:f.pw.value});
    if(r.error)authMsg(authErr(r.error));else toast('Entrou. Sincronizando seus dados...');
  }else if(f.id==='pwForm'){
    var r2=await sb.auth.updateUser({password:f.pw.value});
    if(r2.error)return authMsg(authErr(r2.error));
    recovering=false;render();toast('Senha alterada');
  }
});

document.getElementById('themeBtn').onclick=function(){

};
var lastDay=tk();
setInterval(function(){var k=tk();if(k!==lastDay){lastDay=k;render()}},60000);

initSync();
drawSync();

  var regSW=function(){navigator.serviceWorker.register('sw.js').catch(function(){})};
