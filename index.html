<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha Rotina</title>
<meta name="theme-color" content="#FBFBF7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFBF7; --grid:#E9ECF3; --ink:#1A2550; --ink-soft:#5B6382; --line:#D6DAE6;
  --card:#FFFFFF;
  --est:#2F5BD3; --est-bg:#E7EDFC; --est-bd:#A9BCF0;
  --tre:#C2410C; --tre-bg:#FDE8DC; --tre-bd:#F0B394;
  --off:#6B6F7E; --off-bg:#F0F1F4; --off-bd:#C3C6D0;
  --mark:#FFE45C; --ok:#1F8A4C; --ok-bg:#DDF3E5; --warn:#A15C00; --warn-bg:#FFF1D6; --bad:#C0262D;
  --a-mat:#2F5BD3; --a-nat:#1F8A4C; --a-ling:#8B3FC4; --a-hum:#B4540A; --a-red:#C0262D; --a-tec:#0E7490;
  --shadow:0 1px 0 rgba(26,37,80,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11162A; --grid:#1A2140; --ink:#E9ECF7; --ink-soft:#9AA2C2; --line:#2B3459; --card:#171E38;
    --est:#8FB0FF; --est-bg:#1D2A55; --est-bd:#34488A;
    --tre:#FFA37A; --tre-bg:#3E2419; --tre-bd:#7A3D22;
    --off:#A0A5B8; --off-bg:#1E2440; --off-bd:#3A4266;
    --mark:#8A7400; --ok:#6FDB9A; --ok-bg:#163A27; --warn:#FFC266; --warn-bg:#3A2A10; --bad:#FF7A80;
    --a-mat:#8FB0FF; --a-nat:#6FDB9A; --a-ling:#D2A6FF; --a-hum:#FFB070; --a-red:#FF8A8F; --a-tec:#5ED3EE;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --paper:#11162A; --grid:#1A2140; --ink:#E9ECF7; --ink-soft:#9AA2C2; --line:#2B3459; --card:#171E38;
  --est:#8FB0FF; --est-bg:#1D2A55; --est-bd:#34488A;
  --tre:#FFA37A; --tre-bg:#3E2419; --tre-bd:#7A3D22;
  --off:#A0A5B8; --off-bg:#1E2440; --off-bd:#3A4266;
  --mark:#8A7400; --ok:#6FDB9A; --ok-bg:#163A27; --warn:#FFC266; --warn-bg:#3A2A10; --bad:#FF7A80;
  --a-mat:#8FB0FF; --a-nat:#6FDB9A; --a-ling:#D2A6FF; --a-hum:#FFB070; --a-red:#FF8A8F; --a-tec:#5ED3EE;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink); font-family:'Manrope',system-ui,sans-serif; font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--est);outline-offset:2px;border-radius:6px}
.wrap{max-width:1240px;margin:0 auto;padding:24px 16px 120px}
h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;margin:0;letter-spacing:-.02em}
input,select,textarea{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper);width:100%}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--ink-soft)}

/* Topo */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.brand h1{font-size:clamp(32px,6vw,52px);font-weight:800;line-height:1}
.brand p{margin:6px 0 0;color:var(--ink-soft);font-weight:500}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:8px 14px;min-width:104px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:26px;line-height:1.1}
.stat span{font-size:13px;color:var(--ink-soft);font-weight:600}
.stat.warn{background:var(--warn-bg);border-color:var(--warn)} .stat.warn b{color:var(--warn)}

/* Navegação */
.nav{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:22px;border-bottom:2px solid var(--ink);padding-bottom:10px}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:700;color:var(--ink-soft)}
.tab[aria-current="page"]{background:var(--ink);color:var(--paper)}
.tab:hover:not([aria-current="page"]){color:var(--ink)}
.nav .sp{flex:1}
.icon-btn{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.icon-btn svg{width:16px;height:16px}
.btn{border:0;background:var(--ink);color:var(--paper);border-radius:999px;padding:10px 18px;font-weight:800}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn.sm{padding:6px 12px;font-size:14px}
.link{border:0;background:transparent;font-size:14px;font-weight:700;color:var(--est);padding:4px 0;text-decoration:underline;text-underline-offset:3px}

/* Blocos */
.block{border-radius:14px;padding:12px 14px;border:1.5px solid;display:flex;gap:12px;align-items:flex-start}
.block.estudo{background:var(--est-bg);border-color:var(--est-bd)}
.block.treino{background:var(--tre-bg);border-color:var(--tre-bd)}
.block.descanso{background:var(--off-bg);border-color:var(--off-bd);border-style:dashed}
.block .body{flex:1;min-width:0}
.kind{font-size:13px;font-weight:800;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.estudo .kind{color:var(--est)} .treino .kind{color:var(--tre)} .descanso .kind{color:var(--off)}
.kind .time{font-weight:700;color:var(--ink-soft);background:var(--card);border-radius:999px;padding:0 8px}
.items{margin:4px 0 0;padding:0;list-style:none;font-weight:700}
.items li{line-height:1.3}
.descanso .items{font-weight:500;color:var(--off)}
.block.done .items{text-decoration:line-through;text-decoration-thickness:2px;opacity:.6}
.check{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid currentColor;background:var(--card);display:grid;place-items:center;padding:0}
.estudo .check{color:var(--est)} .treino .check{color:var(--tre)}
.check svg{width:18px;height:18px;opacity:0;transition:opacity .12s}
.done .check{background:currentColor}
.done .check svg{opacity:1;color:var(--card)}
.topicbox{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.topicbox select{background:var(--card);font-weight:600;font-size:14px;padding:6px 8px}
.topicbox .lbl{font-size:12px;font-weight:700;color:var(--ink-soft)}
.pick{font-size:13px;font-weight:600;color:var(--ink-soft);margin-top:4px}
.extra{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}

/* Hoje */
.today{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px}
@media (max-width:820px){.today{grid-template-columns:1fr}}
.dayname{font-size:clamp(44px,9vw,88px);font-weight:800;line-height:.95;display:inline;background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 90%,transparent 90%);padding:0 6px;margin-left:-6px}
.date{color:var(--ink-soft);font-weight:600;margin:10px 0 18px}
.list{display:flex;flex-direction:column;gap:10px}
.progress{height:12px;border-radius:999px;background:var(--off-bg);border:1.5px solid var(--line);overflow:hidden;margin:4px 0 18px}
.progress i{display:block;height:100%;background:var(--ok);transition:width .3s}
.progress.thin{height:8px;margin:6px 0 0;border-width:1px}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.panel h3{font-size:20px;margin-bottom:10px}
.stack > * + *{margin-top:16px}
textarea{min-height:110px;resize:vertical}
.next .block{padding:8px 12px}
.next .items{font-size:14px}
.empty{color:var(--ink-soft);font-weight:500;margin:0}
.allgood{background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:10px 14px;font-weight:800;margin-bottom:12px}
.rev{display:flex;flex-direction:column;gap:8px}
.revrow{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.revrow b{line-height:1.3}
.revrow .meta{font-size:13px;color:var(--ink-soft);font-weight:600}
.revrow .acts{display:flex;gap:6px;flex-wrap:wrap}

/* Semana */
.weekbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.weekbar h2{font-size:22px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:1000px){.week{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.week{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.colhead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px solid var(--ink);padding-bottom:4px}
.colhead h3{font-size:24px}
.colhead span{font-size:13px;font-weight:700;color:var(--ink-soft)}
.col.is-today .colhead h3{background:linear-gradient(transparent 55%,var(--mark) 55%,var(--mark) 92%,transparent 92%);padding:0 4px;margin-left:-4px}
.col .block{padding:10px;gap:8px}
.col .check{width:26px;height:26px}
.col .items{font-size:15px}
.col .kind .time{background:transparent;padding:0}
.dots{font-size:13px;color:var(--ink-soft);font-weight:700}

/* Conteúdo */
.summary{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:16px;align-items:start}
.area-h{display:flex;align-items:center;gap:10px}
.sw{width:14px;height:14px;border-radius:4px;flex:none}
.area-h h2{font-size:26px}
.area-h .cnt{margin-left:auto;font-weight:800;font-size:14px;color:var(--ink-soft);white-space:nowrap}
.area p.desc{margin:4px 0 8px;color:var(--ink-soft);font-weight:500;font-size:15px}
details.grp{border-top:1.5px solid var(--line);padding:8px 0}
details.grp summary{cursor:pointer;font-weight:800;display:flex;justify-content:space-between;gap:8px;list-style:none;padding:4px 0}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary::before{content:'+';width:18px;font-weight:800;color:var(--ink-soft)}
details.grp[open] summary::before{content:'−'}
details.grp summary span.t{flex:1}
details.grp summary span.c{font-size:13px;color:var(--ink-soft)}
.topics{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.topic{display:flex;align-items:center;gap:10px;padding:5px 0}
.topic .nm{flex:1;min-width:0;font-weight:600;line-height:1.3}
.topic.s3 .nm{color:var(--ink-soft)}
.hot{font-size:12px;font-weight:800;color:var(--warn);background:var(--warn-bg);border-radius:999px;padding:1px 8px;white-space:nowrap}
.nx{font-size:12px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
.nx.due{color:var(--warn)}
.st{flex:none;min-width:104px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);padding:4px 10px;font-size:13px;font-weight:800;display:inline-flex;align-items:center;gap:6px;justify-content:flex-start}
.st i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink-soft);flex:none}
.st.s1{border-color:var(--est-bd);color:var(--est)} .st.s1 i{border-color:var(--est);background:linear-gradient(90deg,var(--est) 50%,transparent 50%)}
.st.s2{border-color:var(--est);color:var(--est);background:var(--est-bg)} .st.s2 i{border-color:var(--est);background:var(--est)}
.st.s3{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)} .st.s3 i{border-color:var(--ok);background:var(--ok)}
.legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--ink-soft);font-weight:600}

/* Redação */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-weight:800;font-family:'Bricolage Grotesque',sans-serif}
.steps b{display:block}
.steps span{color:var(--ink-soft);font-size:15px}
.five{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.five span{background:var(--warn-bg);color:var(--warn);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800}
.form{display:grid;gap:10px}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
@media (max-width:520px){.grid5{grid-template-columns:repeat(3,minmax(0,1fr))}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.row2{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:12px;color:var(--ink-soft)}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto}
.del{border:0;background:transparent;color:var(--bad);font-weight:800;font-size:18px;padding:0 6px;line-height:1}
.comp{display:flex;flex-direction:column;gap:8px}
.comp .r{display:grid;grid-template-columns:36px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:14px;font-weight:700}
.comp .r small{display:block;font-weight:500;color:var(--ink-soft);font-size:12px}
.meter{height:10px;border-radius:999px;background:var(--off-bg);overflow:hidden}
.meter i{display:block;height:100%;background:var(--est)}
.meter.low i{background:var(--warn)}
.callout{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px;margin-top:10px}
.replist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.replist li{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.replist li div{flex:1;min-width:0}
.replist .tp{font-size:12px;font-weight:800;color:var(--est)}
.replist .ex{font-size:13px;color:var(--ink-soft);font-weight:600}

/* Progresso */
.statsgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;align-items:start}
.bars{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bar i{display:block;width:100%;max-width:44px;border-radius:8px 8px 3px 3px;background:var(--est);min-height:3px}
.bar.cur i{background:var(--ok)}
.bar small{font-size:11px;color:var(--ink-soft);font-weight:700;white-space:nowrap}
.bar b{font-size:12px}
.split{display:flex;flex-direction:column;gap:12px}
.split .row{display:flex;justify-content:space-between;gap:8px;font-weight:700;margin-bottom:2px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat div{aspect-ratio:1;border-radius:5px;background:var(--off-bg);border:1px solid var(--line)}
.heat .l1{background:color-mix(in srgb,var(--ok) 30%,var(--off-bg))}
.heat .l2{background:color-mix(in srgb,var(--ok) 60%,var(--off-bg))}
.heat .l3{background:var(--ok)}
.heat .fut{opacity:.35}
.hint{color:var(--ink-soft);font-size:14px;margin:0 0 14px}
.up{color:var(--ok);font-weight:800} .down{color:var(--bad);font-weight:800}

/* Editar */
.editday{margin-bottom:18px}
.editday h3{font-size:22px;margin-bottom:8px}
.erow{display:grid;grid-template-columns:110px minmax(0,1fr) 110px 190px auto;gap:8px;align-items:center;margin-bottom:8px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px}
@media (max-width:860px){.erow{grid-template-columns:1fr 1fr}.erow .items-in{grid-column:1/-1;order:-1}.erow .acts{grid-column:1/-1}}
.acts{display:flex;gap:4px;justify-content:flex-end}
.erow .acts button{border:1.5px solid var(--line);background:var(--paper);border-radius:8px;width:36px;height:36px;font-weight:800}
.erow .acts button.d{color:var(--bad)}
.add{border:1.5px dashed var(--ink-soft);background:transparent;border-radius:12px;padding:8px 12px;font-weight:700;color:var(--ink-soft)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 22px;align-items:flex-end}

/* Conta e sincronização */
.dot{width:10px;height:10px;border-radius:50%;background:var(--off-bd);flex:none}
.dot.ok{background:var(--ok)} .dot.busy{background:var(--est)} .dot.err{background:var(--warn)}
.account{max-width:520px}
.account .form{margin-top:10px}
.account .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px;margin-top:12px}
.msg.ok{background:var(--ok-bg);color:var(--ok)} .msg.err{background:var(--warn-bg);color:var(--warn)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv span:first-child{color:var(--ink-soft);font-weight:600}
.kv span:last-child{font-weight:700;text-align:right;overflow-wrap:anywhere}

/* Timer */
.timer{position:fixed;right:16px;bottom:16px;width:300px;max-width:calc(100vw - 32px);background:var(--ink);color:var(--paper);border-radius:20px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:20}
.timer[hidden]{display:none}
.timer .lbl{font-size:13px;opacity:.85;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer .clock{font-family:'Bricolage Grotesque',sans-serif;font-size:48px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.timer .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.timer button{border:1.5px solid rgba(255,255,255,.35);background:transparent;color:inherit;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
.timer button.main{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:700;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Impressão: imprime a tela aberta */
@page{size:A4 portrait;margin:12mm}
@page land{size:A4 landscape;margin:10mm}
@media print{
  body{background:#fff;color:#000}
  .nav,.stats,.timer,.toast,.check,.link,.no-print,.weekbar button,.chips,.topicbox select{display:none!important}
  .wrap{padding:0;max-width:none}
  .week{page:land;grid-template-columns:repeat(7,1fr)!important;gap:8px}
  .block.done .items{text-decoration:none;opacity:1}
  .panel{box-shadow:none;break-inside:avoid}
  .areas{display:block}.areas .panel{margin-bottom:12px}
  .st{min-width:0;border:0;padding:0}.st span{display:none}
  .st i{width:14px;height:14px;border-radius:3px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Minha Rotina</h1>
      <p id="sub"></p>
    </div>

function pad(n){return String(n).padStart(2,'0')}
function dkey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function pk(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function startOfDay(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function dayIdx(d){return (d.getDay()+6)%7}
function mondayOf(d){var x=startOfDay(d);return addDays(x,-dayIdx(x))}
function fmt(d,o){return d.toLocaleDateString('pt-BR',o)}
function today(){return startOfDay(new Date())}
function tk(){return dkey(today())}
function daysBetween(a,b){return Math.round((startOfDay(b)-startOfDay(a))/864e5)}
function shortDate(k){return fmt(pk(k),{day:'numeric',month:'short'})}

/* =========================================================
   TÓPICOS E REVISÃO ESPAÇADA (1, 7 e 30 dias)
   s: 0 não visto · 1 estudado · 2 revisado · 3 dominado
   ========================================================= */
var STATUS=['Não visto','Estudado','Revisado','Dominado'];
var REV=[1,7,30];
function tstate(id){return topics[id]||{s:0}}
function studyTopic(id,dateKey){
  var t=TOPICS[id];
  topics[id]={s:1,at:dateKey,n:0,next:t.rev?dkey(addDays(pk(dateKey),REV[0])):null};
  save('topics',topics);
}
function reviewTopic(id,ok){
  var t=topics[id];if(!t)return;
  if(ok){
    t.n=(t.n||0)+1;
    if(t.n>=REV.length){t.s=3;t.next=null}
    else{t.s=2;t.next=dkey(addDays(today(),REV[t.n]))}
  }else{t.next=dkey(addDays(today(),1))}
  save('topics',topics);
}
function cycleTopic(id){
  var s=tstate(id).s,rev=TOPICS[id].rev;
  if(s===0)studyTopic(id,tk());
  else if(s===1){topics[id].s=2;topics[id].n=1;topics[id].next=rev?dkey(addDays(today(),REV[1])):null}
  else if(s===2){topics[id].s=3;topics[id].next=null}
  else delete topics[id];
  save('topics',topics);
}
function dueReviews(){
  var k=tk();
  return Object.keys(topics).filter(function(id){return TOPICS[id]&&topics[id].next&&topics[id].next<=k})
    .sort(function(a,b){return topics[a].next<topics[b].next?-1:1});
}
function suggestTopic(subj){
  var list=topicsFor(subj);
  for(var i=0;i<list.length;i++)if(tstate(list[i].id).s===0)return list[i].id;
  for(var j=0;j<list.length;j++)if(tstate(list[j].id).s<3)return list[j].id;
  return null;
}
function pickFor(dateKey,b){
  var p=picks[dateKey]&&picks[dateKey][b.id];
  if(p&&TOPICS[p.t])return p.t;
  return suggestTopic(b.subject);
}
function areaCoverage(areaId){
  var list=TOPIC_LIST.filter(function(t){return !areaId||t.area===areaId});
  var st=0,dom=0;list.forEach(function(t){var s=tstate(t.id).s;if(s>=1)st++;if(s===3)dom++});
  return {total:list.length,studied:st,mastered:dom};
}

function checkable(b){return b.type!=='descanso'}
function isDone(date,id){var p=progress[dkey(date)];return !!(p&&p[id])}
function setDone(date,b,val){
  var k=dkey(date);progress[k]=progress[k]||{};
  if(val){
    progress[k][b.id]=true;
    if(topicsFor(b.subject).length){
      var t=pickFor(k,b);
      if(t){
        var auto=tstate(t).s===0;
        if(auto)studyTopic(t,k);
        picks[k]=picks[k]||{};picks[k][b.id]={t:t,auto:auto};save('picks',picks);
        if(auto)toast('Tópico marcado como estudado'+(TOPICS[t].rev?'. Primeira revisão amanhã.':'.'));
      }
    }
  }else{
    delete progress[k][b.id];
    var p=picks[k]&&picks[k][b.id];
    if(p&&p.auto&&topics[p.t]&&topics[p.t].s===1&&topics[p.t].at===k){delete topics[p.t];p.auto=false;save('topics',topics);save('picks',picks)}
  }
  if(!Object.keys(progress[k]).length)delete progress[k];
  save('progress',progress);
}
function dayScore(date){
  var bl=routine[dayIdx(date)].filter(checkable);
  var done=bl.filter(function(b){return isDone(date,b.id)}).length;
  return {done:done,total:bl.length};
}
function rangeScore(from,days,filterType){
  var d=0,t=0;
  for(var i=0;i<days;i++){
    var dt=addDays(from,i);
    routine[dayIdx(dt)].forEach(function(b){
      if(!checkable(b))return;if(filterType&&b.type!==filterType)return;
      t++;if(isDone(dt,b.id))d++;
    });
  }
  return {done:d,total:t};
}
function pct(s){return s.total?Math.round(s.done/s.total*100):0}
function dayComplete(date){var s=dayScore(date);return s.total>0&&s.done===s.total}
function streakNow(){
  var d=today(),n=0;
  if(!dayComplete(d))d=addDays(d,-1);
  for(var i=0;i<400;i++){
    var s=dayScore(d);
    if(s.total===0){d=addDays(d,-1);continue}
    if(s.done===s.total){n++;d=addDays(d,-1)}else break;
  }
  return n;
}
function bestStreak(){var best=load('best',0),cur=streakNow();if(cur>best){best=cur;save('best',best)}return best}

        });
        h+='</select></div>';
      }else h+='<p class="pick">Todos os tópicos desta matéria estão dominados.</p>';
    }else if(cur&&(done||opts.showPick)){
      var p=picks[k]&&picks[k][b.id];
      if(p||done)h+='<div class="pick">Tópico: '+esc(TOPICS[cur].nome)+'</div>';
    }
  }
  if(opts.full&&!done){
    h+='<div class="extra">';
    if(b.type==='estudo')h+='<button class="link" data-act="focus" data-label="'+esc(focusLabel)+'">Iniciar foco de 25 min</button>';
    if(b.subject==='rev'){var n=dueReviews().length;h+='<span class="pick">'+(n?n+' revisão'+(n>1?'ões':'')+' pendente'+(n>1?'s':'')+' no painel ao lado':'Nenhuma revisão pendente hoje')+'</span>'}

    h+='</div>';
  }
  h+='</div></div>';
  return h;
}

function renderConteudo(){
  var all=areaCoverage(),due=dueReviews();

  [['todos','Todos'],['pendentes','Ainda não dominados'],['naovistos','Não vistos'],['revisar','Para revisar hoje ('+due.length+')'],['hot','Cai muito']].forEach(function(f){
    h+='<button class="chip" data-act="cf" data-f="'+f[0]+'" aria-pressed="'+(contentFilter===f[0])+'">'+f[1]+'</button>';
  });
  h+='</div><span style="flex:1"></span><button class="icon-btn no-print" data-act="print">Imprimir checklist</button></div>';
  h+='<p class="hint">'+all.studied+' de '+all.total+' tópicos estudados · '+all.mastered+' dominados. Clique no status para avançar: não visto, estudado, revisado, dominado. Ao estudar um tópico, ele volta para revisão em 1, 7 e 30 dias.</p>';
  h+='<div class="legend" style="margin-bottom:16px">'+STATUS.map(function(s,i){return '<span class="st s'+i+'" aria-hidden="true"><i></i>'+s+'</span>'}).join('')+'</div>';
  h+='<div class="areas">';
  var dueSet={};due.forEach(function(id){dueSet[id]=1});
  SYLLABUS.forEach(function(a){
    var cov=areaCoverage(a.id),pp=Math.round(cov.studied/cov.total*100);
    var gh='';
    a.grupos.forEach(function(g,gi){
      var rows='',gs=0,gt=0;
      g.t.forEach(function(t,ti){
        var id=a.id+'.'+gi+'.'+ti,T=TOPICS[id],st=tstate(id);gt++;if(st.s>=1)gs++;
        if(contentFilter==='pendentes'&&st.s===3)return;
        if(contentFilter==='naovistos'&&st.s!==0)return;
        if(contentFilter==='revisar'&&!dueSet[id])return;
        if(contentFilter==='hot'&&!T.hot)return;
        rows+='<li class="topic s'+st.s+'"><button class="st s'+st.s+'" data-act="cycle" data-t="'+id+'" aria-label="'+esc(T.nome)+': '+STATUS[st.s]+'. Avançar status"><i></i><span>'+STATUS[st.s]+'</span></button>';
        rows+='<span class="nm">'+esc(T.nome)+'</span>';
        if(T.hot)rows+='<span class="hot">cai muito</span>';
        if(st.next)rows+='<span class="nx'+(dueSet[id]?' due':'')+'">'+(dueSet[id]?'revisar hoje':'rev. '+shortDate(st.next))+'</span>';
        rows+='</li>';
      });
      if(!rows)return;
      gh+='<details class="grp" open><summary><span class="t">'+esc(g.nome)+'</span><span class="c">'+gs+'/'+gt+'</span></summary><ul class="topics">'+rows+'</ul></details>';
    });
    if(!gh)return;
    h+='<section class="panel area"><div class="area-h"><span class="sw" style="background:var('+a.cor+')"></span><h2>'+esc(a.nome)+'</h2><span class="cnt">'+cov.studied+'/'+cov.total+'</span></div>';
    h+='<p class="desc">'+esc(a.desc)+'</p><div class="progress thin" role="progressbar" aria-label="'+esc(a.nome)+' estudado" aria-valuenow="'+pp+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+pp+'%;background:var('+a.cor+')"></i></div>';
    h+=gh+'</section>';
  });
  h+='</div>';
  if(h.indexOf('<section')<0)h+='<p class="empty">Nenhum tópico neste filtro.</p>';
  return h;
}

  document.getElementById('sub').textContent=fmt(new Date(),{weekday:'long',day:'numeric',month:'long'});
}
function render(){
  document.querySelectorAll('.tab').forEach(function(t){if(t.dataset.view===view)t.setAttribute('aria-current','page');else t.removeAttribute('aria-current')});
  var V={hoje:renderHoje,semana:renderSemana,conteudo:renderConteudo,redacao:renderRedacao,progresso:renderProgresso,editar:renderEditar,conta:renderConta};
  document.getElementById('main').innerHTML=(V[view]||renderHoje)();
  renderStats();
  if(view==='conta')document.getElementById('syncBtn').setAttribute('aria-current','page');else document.getElementById('syncBtn').removeAttribute('aria-current');
  drawSync();
}
function keepFocus(sel){var el=document.querySelector(sel);if(el)el.focus()}

/* =========================================================
   EVENTOS
   ========================================================= */
document.querySelector('.nav').addEventListener('click',function(e){var t=e.target.closest('.tab,[data-view-go]');if(t)go(t.dataset.view||t.dataset.viewGo)});

var main=document.getElementById('main');
main.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,day=+b.dataset.day,i=+b.dataset.i;
  if(a==='toggle'){
    var d=pk(b.dataset.date),blk=routine[dayIdx(d)].filter(function(x){return x.id===b.dataset.id})[0];if(!blk)return;
    var was=isDone(d,blk.id);setDone(d,blk,!was);render();
    if(!was&&dayComplete(d)&&dkey(d)===tk())toast('Dia concluído! Sequência: '+streakNow()+' dias');
    keepFocus('[data-act="toggle"][data-id="'+blk.id+'"][data-date="'+b.dataset.date+'"]');
  }
  else if(a==='focus')startTimer(b.dataset.label);
  else if(a==='go')go(b.dataset.v);
  else if(a==='rev-ok'||a==='rev-no'){reviewTopic(b.dataset.t,a==='rev-ok');render();toast(a==='rev-ok'?(topics[b.dataset.t].s===3?'Tópico dominado!':'Próxima revisão em '+shortDate(topics[b.dataset.t].next)):'Volta para revisão amanhã')}
  else if(a==='cycle'){cycleTopic(b.dataset.t);render();keepFocus('[data-act="cycle"][data-t="'+b.dataset.t+'"]')}
  else if(a==='cf'){contentFilter=b.dataset.f;render()}
  else if(a==='wk'){weekOffset=b.dataset.d==='0'?0:weekOffset+(+b.dataset.d);render()}
  else if(a==='print'){document.querySelectorAll('details').forEach(function(x){x.open=true});window.print()}
  else if(a==='resetweek'){
    if(!confirm('Limpar todas as marcações desta semana?'))return;
    var mon=addDays(mondayOf(new Date()),weekOffset*7);
    for(var k=0;k<7;k++)delete progress[dkey(addDays(mon,k))];
    save('progress',progress);render();toast('Marcações da semana limpas');
  }
  else if(a==='del-essay'){if(!confirm('Apagar esta redação?'))return;essays=essays.filter(function(x){return x.id!==b.dataset.id});save('essays',essays);render()}
  else if(a==='del-rep'){if(!confirm('Apagar este repertório?'))return;reps=reps.filter(function(x){return x.id!==b.dataset.id});save('reps',reps);render()}
  else if(a==='del-sim'){if(!confirm('Apagar este simulado?'))return;sims=sims.filter(function(x){return x.id!==b.dataset.id});save('sims',sims);render()}
  else if(a==='add'){routine[day].push(B(uid(),'estudo',['Novo bloco']));saveRoutine();render();
    var ins=document.querySelectorAll('[data-f="items"][data-day="'+day+'"]');if(ins.length){ins[ins.length-1].focus();ins[ins.length-1].select()}}
  else if(a==='del'){if(!confirm('Remover este bloco?'))return;routine[day].splice(i,1);saveRoutine();render()}
  else if(a==='up'&&i>0){var r=routine[day];r.splice(i-1,0,r.splice(i,1)[0]);saveRoutine();render()}
  else if(a==='down'&&i<routine[day].length-1){var r2=routine[day];r2.splice(i+1,0,r2.splice(i,1)[0]);saveRoutine();render()}
  else if(a==='restore'){if(!confirm('Voltar para a rotina original? Marcações, tópicos e anotações continuam.'))return;routine=clone(DEFAULT);saveRoutine();render();toast('Rotina original restaurada')}
  else if(a==='export')exportData();
  else if(a==='import')document.getElementById('importFile').click();
});

main.addEventListener('input',function(e){
  var el=e.target;
  if(el.id==='note'){var k=el.dataset.date;if(el.value.trim())notes[k]=el.value;else delete notes[k];save('notes',notes);return}
  if(el.id==='repSearch'){repSearch=el.value;var pos=el.selectionStart;render();var s=document.getElementById('repSearch');if(s){s.focus();s.setSelectionRange(pos,pos)}return}
  if(!el.dataset.f||el.tagName==='SELECT')return;
  var b=routine[+el.dataset.day][+el.dataset.i];if(!b)return;
  if(el.dataset.f==='items')b.items=el.value.split(',').map(function(s){return s.trim()}).filter(Boolean);
  else b[el.dataset.f]=el.value;
  saveRoutine();renderStats();
});
main.addEventListener('change',function(e){
  var el=e.target;
  if(el.dataset.pick){var k=el.dataset.date;picks[k]=picks[k]||{};picks[k][el.dataset.pick]={t:el.value,auto:false};save('picks',picks);render();keepFocus('[data-pick="'+el.dataset.pick+'"]');return}
  if(el.id==='examDate'){exam=el.value;save('exam',exam);renderStats();return}
  if(el.dataset.f&&el.tagName==='SELECT'){routine[+el.dataset.day][+el.dataset.i][el.dataset.f]=el.value;saveRoutine();renderStats()}
});
main.addEventListener('submit',function(e){
  e.preventDefault();var f=e.target,fd=new FormData(f);
  if(f.id==='essayForm'){
    essays.push({id:uid(),date:fd.get('date'),tema:String(fd.get('tema')).trim(),c:[0,1,2,3,4].map(function(i){return +fd.get('c'+i)})});
    save('essays',essays);render();toast('Redação salva');
  }else if(f.id==='repForm'){
    reps.unshift({id:uid(),txt:String(fd.get('txt')).trim(),tipo:fd.get('tipo'),eixos:String(fd.get('eixos')||'').trim()});
    save('reps',reps);render();toast('Repertório adicionado ao banco');keepFocus('#repForm input[name="txt"]');
  }else if(f.id==='simForm'){
    var x={id:uid(),date:fd.get('date'),nome:String(fd.get('nome')).trim()};
    ['lc','ch','cn','mt'].forEach(function(k){x[k]=clamp(fd.get(k),0,45)});x.red=clamp(fd.get('red'),0,1000);
    sims.push(x);save('sims',sims);render();toast('Simulado salvo');
  }
});
function saveRoutine(){save('routine.v2',routine)}

/* =========================================================
   BACKUP
   ========================================================= */
function exportData(){
  var data={app:'minha-rotina',versao:2,exportadoEm:new Date().toISOString()};
  KEYS.forEach(function(k){data[k]=load(k,null)});
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rotina-backup-'+tk()+'.json';
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
  toast('Backup baixado');
}
document.getElementById('importFile').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var d=JSON.parse(rd.result);if(d.app!=='minha-rotina')throw 0;
      if(d.versao===1){d['routine.v2']=null}            // backup antigo: mantém a rotina nova, importa marcações
      if(!confirm('Substituir os dados deste aparelho pelo backup?'))return;
      KEYS.forEach(function(k){if(d[k]!=null)save(k,d[k])});
      location.reload();
    }catch(err){toast('Arquivo inválido. Use um backup baixado por este site.')}
  };
  rd.readAsText(f);e.target.value='';
});

/* =========================================================
   CRONÔMETRO DE FOCO (25/5, pausa longa a cada 4)
   ========================================================= */
var T={mode:'foco',end:0,left:25*60,running:false,label:'',int:null,count:0};
var DUR={foco:25*60,pausa:5*60,longa:15*60};
var tEl=document.getElementById('timer');
function tDraw(){
  var s=Math.max(0,Math.round(T.running?(T.end-Date.now())/1000:T.left));
  var txt=pad(Math.floor(s/60))+':'+pad(s%60);
  document.getElementById('tClock').textContent=txt;
  document.getElementById('tLabel').textContent=T.label||'Foco';
  document.getElementById('tMode').textContent=(T.mode==='foco'?'Foco':T.mode==='pausa'?'Pausa curta':'Pausa longa')+' · ciclos concluídos: '+T.count;
  document.getElementById('tPlay').textContent=T.running?'Pausar':'Continuar';
  document.title=T.running?txt+' · Minha Rotina':'Minha Rotina';
  if(T.running&&s<=0)tFinish();
}
function startTimer(label){T.label=label;T.mode='foco';T.left=DUR.foco;T.running=true;T.end=Date.now()+T.left*1000;tEl.hidden=false;tTick();tDraw()}
function tTick(){clearInterval(T.int);T.int=setInterval(tDraw,500)}
function beep(){try{var c=new (window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(function(t){var o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.2,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+.2);o.start(c.currentTime+t);o.stop(c.currentTime+t+.22)})}catch(e){}}
function tFinish(){
  beep();
  if(T.mode==='foco'){T.count++;var k=tk();focus[k]=(focus[k]||0)+25;save('focus',focus);T.mode=T.count%4===0?'longa':'pausa';toast('Foco concluído. Hora da pausa.')}
  else{T.mode='foco';toast('Pausa encerrada. Bora pro próximo foco.')}
  T.left=DUR[T.mode];T.end=Date.now()+T.left*1000;
}
document.getElementById('tPlay').onclick=function(){
  if(T.running){T.left=Math.max(0,(T.end-Date.now())/1000);T.running=false}
  else{T.end=Date.now()+T.left*1000;T.running=true;tTick()}
  tDraw();
};
document.getElementById('tSkip').onclick=function(){T.running=true;T.end=Date.now();tDraw()};
document.getElementById('tReset').onclick=function(){T.left=DUR[T.mode];T.running=false;tDraw()};
document.getElementById('tClose').onclick=function(){clearInterval(T.int);T.running=false;tEl.hidden=true;document.title='Minha Rotina'};

/* =========================================================
   SINCRONIZAÇÃO COM O SUPABASE
   Guarda tudo numa linha da tabela rotina_dados (uma por usuário).
   O aparelho continua salvando localmente; a nuvem recebe uma cópia
   1,5 s depois de cada mudança e é consultada ao abrir o site.
   ========================================================= */
var TABLE='rotina_dados',sb=null,user=null,syncState='off',syncMsg='',pushT=null,gen=0,recovering=false,busyReconcile=false;
function meta(k,d){return load('sync.'+k,d)}
function setMeta(k,v){rawSave('sync.'+k,v)}
function markDirty(){gen++;setMeta('dirty',true);if(user){clearTimeout(pushT);pushT=setTimeout(push,1500);setSync('busy')}}
var SLABEL={off:'Só neste aparelho',out:'Entrar',ok:'Salvo na nuvem',busy:'Salvando...',err:'Nuvem indisponível'};
function setSync(s,msg){syncState=s;syncMsg=msg||'';drawSync()}
function drawSync(){
  var d=document.getElementById('syncDot');d.className='dot'+(syncState==='ok'?' ok':syncState==='busy'?' busy':syncState==='err'?' err':'');
  document.getElementById('syncTxt').textContent=SLABEL[syncState];
  document.getElementById('syncBtn').title=syncMsg||SLABEL[syncState];
  var st=document.getElementById('syncStatus');if(st)st.textContent=SLABEL[syncState]+(syncMsg?': '+syncMsg:'');
  var la=document.getElementById('syncAt');if(la)la.textContent=lastSyncText();
}
function lastSyncText(){var a=meta('at','');return a?new Date(a).toLocaleString('pt-BR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'nunca'}
function errText(e){
  var m=(e&&e.message)||String(e);
  if(/fetch|network|load failed/i.test(m))return 'sem conexão ou projeto do Supabase pausado';
  if(/relation|does not exist|schema cache/i.test(m))return 'tabela rotina_dados não encontrada, rode o SQL de configuração';
  if(/row-level security|permission/i.test(m))return 'sem permissão, confira as regras (RLS) do SQL de configuração';
  return m;
}
function collect(){var o={};KEYS.forEach(function(k){var v=load(k,undefined);if(v!==undefined)o[k]=v});return o}
function hasLocalData(){
  return KEYS.some(function(k){
    var v=load(k,null);if(v==null||k==='best'||k==='exam')return false;
    if(k==='routine.v2')return true;
    if(Array.isArray(v))return v.length>0;
    return typeof v==='object'?Object.keys(v).length>0:!!v;
  });
}
function adopt(r){
  var d=r.dados||{};
  KEYS.forEach(function(k){if(d[k]!=null)rawSave(k,d[k]);else{try{localStorage.removeItem(PREFIX+k)}catch(e){}}});
  setMeta('at',r.atualizado_em);setMeta('dirty',false);
  reloadState();render();setSync('ok');
}
function newer(a,b){return new Date(a||0).getTime()>new Date(b||0).getTime()}
async function push(){
  if(!user)return;
  var g=gen;setSync('busy');
  try{
    var res=await sb.from(TABLE).upsert({user_id:user.id,dados:collect()},{onConflict:'user_id'}).select('atualizado_em').single();
    if(res.error)throw res.error;
    setMeta('at',res.data.atualizado_em);
    if(g===gen)setMeta('dirty',false);
    setSync('ok');
  }catch(e){setSync('err',errText(e))}
}
async function reconcile(){
  if(!user||busyReconcile)return;busyReconcile=true;setSync('busy');
  try{
    var res=await sb.from(TABLE).select('dados,atualizado_em').eq('user_id',user.id).maybeSingle();
    if(res.error)throw res.error;
    var r=res.data,lastUid=meta('uid',''),at=meta('at',''),dirty=meta('dirty',false);
    if(!r){setMeta('uid',user.id);await push();return}             // primeira vez: envia o que existe aqui
    if(lastUid!==user.id){
      setMeta('uid',user.id);
      if(!lastUid&&hasLocalData()&&!confirm('Esta conta já tem dados salvos na nuvem.\n\nOK: usar os dados da nuvem neste aparelho.\nCancelar: substituir a nuvem pelos dados deste aparelho.')){await push();return}
      adopt(r);return;
    }
    if(newer(r.atualizado_em,at)){
      if(dirty&&!confirm('Houve mudanças em outro aparelho e também neste.\n\nOK: ficar com a versão da nuvem.\nCancelar: ficar com a versão deste aparelho.')){await push();return}
      adopt(r);return;
    }
    if(dirty){await push();return}
    setSync('ok');
  }catch(e){setSync('err',errText(e))}
  finally{busyReconcile=false}
}
function initSync(){
  if(!SUPABASE_URL||!SUPABASE_KEY){setSync('off');return}
  if(!window.supabase){setSync('err','não foi possível carregar a biblioteca do Supabase');return}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  setSync('out');
  sb.auth.onAuthStateChange(function(ev,session){
    var u=session?session.user:null;
    if(ev==='PASSWORD_RECOVERY'){recovering=true;view='conta'}
    if(u&&(!user||user.id!==u.id)){user=u;setTimeout(reconcile,0)}
    else if(!u){user=null;setSync('out')}
    if(view==='conta')render();
  });
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&user)reconcile()});
  setInterval(function(){if(user&&syncState==='err')reconcile()},60000);
}

/* Tela: Conta */
function renderConta(){
  var h='<div class="account stack">';
  if(!SUPABASE_URL||!SUPABASE_KEY){
    h+='<div class="panel"><h3>Salvar na nuvem</h3><p class="hint">A sincronização ainda não foi configurada. Seus dados estão salvos só neste aparelho.</p><p class="hint" style="margin:0">Para ativar, preencha <b>SUPABASE_URL</b> e <b>SUPABASE_KEY</b> no início do arquivo index.html e suba de novo no GitHub.</p></div>';
  }else if(!sb){
    h+='<div class="panel"><h3>Salvar na nuvem</h3><div class="msg err">Não foi possível carregar o Supabase. Confira sua internet e recarregue a página.</div></div>';
  }else if(recovering){
    h+='<div class="panel"><h3>Criar nova senha</h3><form class="form" id="pwForm"><label class="f">Nova senha<input type="password" name="pw" minlength="6" autocomplete="new-password" required></label><div><button class="btn" type="submit">Salvar nova senha</button></div></form><div id="authMsg"></div></div>';
  }else if(user){
    h+='<div class="panel"><h3>Sua conta</h3>';
    h+='<div class="kv"><span>E-mail</span><span>'+esc(user.email)+'</span></div>';
    h+='<div class="kv"><span>Status</span><span id="syncStatus"></span></div>';
    h+='<div class="kv"><span>Última sincronização</span><span id="syncAt"></span></div>';
    h+='<div class="row" style="margin-top:14px"><button class="btn" data-act="sync-now">Sincronizar agora</button><button class="btn ghost" data-act="logout">Sair</button></div>';
    h+='<p class="hint" style="margin:14px 0 0">Se o status ficar como "Nuvem indisponível" por vários dias, o Supabase pausou seu projeto por falta de uso. Reative no painel do Supabase e volte para a rotina. Enquanto isso, tudo continua salvo neste aparelho.</p></div>';
  }else{
    h+='<div class="panel"><h3>Entrar</h3><p class="hint" style="margin:0">Entre para salvar sua rotina na nuvem e usar os mesmos dados no celular e no computador.</p>';
    h+='<form class="form" id="authForm"><label class="f">E-mail<input type="email" name="email" autocomplete="email" required></label>';
    h+='<label class="f">Senha<input type="password" name="pw" minlength="6" autocomplete="current-password" required></label>';
    h+='<div class="row"><button class="btn" type="submit">Entrar</button><button class="btn ghost" type="button" data-act="signup">Criar conta</button><button class="link" type="button" data-act="forgot">Esqueci a senha</button></div></form><div id="authMsg"></div></div>';
  }
  return h+'</div>';
}
function authMsg(t,ok){var m=document.getElementById('authMsg');if(m)m.innerHTML='<div class="msg '+(ok?'ok':'err')+'">'+esc(t)+'</div>'}
function authErr(e){
  var m=(e&&e.message)||'';
  if(/invalid login/i.test(m))return 'E-mail ou senha incorretos.';
  if(/not confirmed/i.test(m))return 'Confirme seu e-mail pelo link que enviamos antes de entrar.';
  if(/already registered|already exists/i.test(m))return 'Este e-mail já tem conta. Use Entrar.';
  if(/password/i.test(m)&&/6/.test(m))return 'A senha precisa ter pelo menos 6 caracteres.';
  if(/rate limit/i.test(m))return 'Muitas tentativas seguidas. Espere alguns minutos e tente de novo.';
  return errText(e);
}
function formVals(){var f=document.getElementById('authForm');return f?{email:f.email.value.trim(),pw:f.pw.value,form:f}:null}
var HERE=location.origin+location.pathname;
main.addEventListener('click',async function(e){
  var b=e.target.closest('[data-act]');if(!b||!sb)return;
  var a=b.dataset.act;
  if(a==='signup'){
    var v=formVals();if(!v.form.reportValidity())return;
    var r=await sb.auth.signUp({email:v.email,password:v.pw,options:{emailRedirectTo:HERE}});
    if(r.error)return authMsg(authErr(r.error));
    if(!r.data.session)authMsg('Conta criada. Abra o link de confirmação que enviamos para '+v.email+' e depois entre aqui.',true);
  }else if(a==='forgot'){
    var v2=formVals();if(!v2.email){authMsg('Digite seu e-mail no campo acima e clique de novo em Esqueci a senha.');return}
    var r2=await sb.auth.resetPasswordForEmail(v2.email,{redirectTo:HERE});
    if(r2.error)return authMsg(authErr(r2.error));
    authMsg('Enviamos um link para criar uma nova senha em '+v2.email+'.',true);
  }else if(a==='logout'){
    await sb.auth.signOut();user=null;setMeta('uid','');setMeta('at','');setSync('out');render();toast('Você saiu. Os dados continuam neste aparelho.');
  }else if(a==='sync-now'){await reconcile();if(syncState==='ok')toast('Sincronizado')}
});
main.addEventListener('submit',async function(e){
  var f=e.target;if(!sb)return;
  if(f.id==='authForm'){
    var r=await sb.auth.signInWithPassword({email:f.email.value.trim(),password:f.pw.value});
    if(r.error)authMsg(authErr(r.error));else toast('Entrou. Sincronizando seus dados...');
  }else if(f.id==='pwForm'){
    var r2=await sb.auth.updateUser({password:f.pw.value});
    if(r2.error)return authMsg(authErr(r2.error));
    recovering=false;render();toast('Senha alterada');
  }
});

/* =========================================================
   TEMA E VIRADA DO DIA
   ========================================================= */
function applyTheme(){if(theme==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',theme)}
document.getElementById('themeBtn').onclick=function(){
  var dark=theme==='dark'||(theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
  theme=dark?'light':'dark';save('theme',theme);applyTheme();
};
var lastDay=tk();
setInterval(function(){var k=tk();if(k!==lastDay){lastDay=k;render()}},60000);

applyTheme();
render();
initSync();
drawSync();
})();
