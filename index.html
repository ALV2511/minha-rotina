function habAction(a,b){
  if(a==='w-add'||a==='h-water'){
    var ml=a==='h-water'?200:+b.dataset.ml,g=waterGoalMl(),was=waterMl(tk());
    if(waterAdd(ml)){render();toast(was<g&&waterMl(tk())>=g?'Meta de água de hoje batida!':'+ '+ml+' ml de água')}
    return true;
  }
  if(a==='w-undo'){waterUndo();render();return true}
  if(a==='h-focus'){startTimer('Foco: deixando a vontade passar','');toast('Foco de 25 minutos iniciado');return true}
  if(!/^h-/.test(a))return false;
  if(a==='h-sync'){
    var on=b.dataset.on==='1';
    if(on&&!confirm('Ativar a sincronização envia este registro para a sua conta, junto com o resto da rotina. Quem administra o banco de dados do site consegue ler esses dados.\n\nContinuar?'))return true;
    save('habitSync',on);syncHabitKey();
    if(on&&habit)markDirty();
    render();toast(on?'Sincronização do hábito ativada':'Este registro voltou a ficar só neste aparelho');return true;
  }
  if(a==='h-del'){
    if(!habit||!confirm('Apagar todo o registro deste hábito? Isso não pode ser desfeito.'))return true;
    habit=null;try{localStorage.removeItem(PREFIX+'habit')}catch(err){}
    if(KEYS.indexOf('habit')>=0)markDirty();
    render();toast('Registro apagado');return true;
  }
  if(!habit)return true;
  if(a==='h-urge'){
    var k=tk();habit.urges[k]=(habit.urges[k]||0)+1;habSave();render();toast('Mais uma vontade que passou');return true;
  }
  if(a==='h-urge-undo'){
    var k2=tk();if(habit.urges[k2]){habit.urges[k2]--;if(habit.urges[k2]<=0)delete habit.urges[k2];habSave();render()}return true;
  }
  if(a==='h-delrel'){
    if(!confirm('Apagar este registro?'))return true;
    habit.rel=habit.rel.filter(function(r){return r.id!==b.dataset.id});habSave();render();return true;
  }
  return true;
}
function habSubmit(f,fd){
  if(f.id==='waterForm'){
    var ml=parseInt(fd.get('ml'),10);
    if(!(ml>=50&&ml<=2000)){toast('Informe de 50 a 2000 ml');return true}
    var g=waterGoalMl(),was=waterMl(tk());waterAdd(ml);render();
    toast(was<g&&waterMl(tk())>=g?'Meta de água de hoje batida!':'+ '+ml+' ml de água');return true;
  }
  if(f.id==='waterGoalForm'){
    var gl=parseInt(fd.get('goal'),10);
    if(!(gl>=500&&gl<=6000)){toast('Informe uma meta entre 500 e 6000 ml');return true}
    waterGoal=Math.round(gl/50)*50;save('waterGoal',waterGoal);render();toast('Meta de água salva');return true;
  }
  if(f.id==='habStartForm'){
    var st=String(fd.get('start')||'');
    if(!/^\d{4}-\d{2}-\d{2}$/.test(st)||st>tk()){toast('Escolha uma data de hoje ou anterior');return true}
    habit={name:String(fd.get('name')||'').trim().slice(0,40),start:st,rel:[],urges:{},plan:null};
    habSave();render();toast('Contagem iniciada');return true;
  }
  if(!habit)return false;
  if(f.id==='habRelForm'){
    var dt=String(fd.get('date')||'');
    if(!/^\d{4}-\d{2}-\d{2}$/.test(dt)||dt>tk()){toast('Escolha uma data de hoje ou anterior');return true}
    var gs=fd.getAll('g').filter(function(x){return HAB_GATILHOS.indexOf(x)>=0});
    habit.rel.push({id:uid(),date:dt,g:gs,n:String(fd.get('n')||'').trim().slice(0,300)});
    habFix();habSave();render();toast('Registrado. Uma recaída não apaga o que você já construiu.');return true;
  }
  if(f.id==='habPlanForm'){
    var lines=String(fd.get('plan')||'').split('\n').map(function(s){return s.trim().slice(0,80)}).filter(Boolean).slice(0,8);
    habit.plan=lines.length?lines:null;habSave();render();toast('Plano salvo');return true;
  }
  if(f.id==='habCfgForm'){
    var s2=String(fd.get('start')||'');
    if(!/^\d{4}-\d{2}-\d{2}$/.test(s2)||s2>tk()){toast('Escolha uma data de hoje ou anterior');return true}
    habit.name=String(fd.get('name')||'').trim().slice(0,40);habit.start=s2;
    habFix();habSave();render();toast('Salvo');return true;
  }
  return false;
}

/* =========================================================
   TREINOS: planos, exercícios, registro do dia e histórico
   workouts = [{id,nome,dias:[0..6],ex:[{id,nome,s,r,k,d,o}]}]
     s séries, r repetições (texto, ex.: "10" ou "8-12"), k carga em kg (ou null), d descanso em segundos (ou null), o observação
   wlog = [{id,date,wid,nome,ex:[{id,nome,sets:[{r,k}]}],obs}]   (guarda o nome, então apagar um treino não apaga o histórico)
   ========================================================= */
var trSel=load('trSel',''),trTab=load('trTab','registrar'),trEdit='',trNew=false;
function trFmtKg(k){return k==null?'':(Math.round(k*100)/100).toLocaleString('pt-BR')+' kg'}
function trNum(v,min,max,dec){
  v=String(v==null?'':v).trim().replace(',','.');
  if(v==='')return null;
  var n=Number(v);
  if(isNaN(n)||n<min||n>max)return NaN;
  return dec?Math.round(n*100)/100:Math.round(n);
}
function trById(id){for(var i=0;i<workouts.length;i++)if(workouts[i].id===id)return workouts[i];return null}
function trToday(){var i=dayIdx(today());for(var j=0;j<workouts.length;j++)if((workouts[j].dias||[]).indexOf(i)>=0)return workouts[j];return null}
function trCur(){return trById(trSel)||trToday()||workouts[0]||null}
function trSave(){save('workouts',workouts)}
function trLogSave(){save('wlog',wlog)}
function trSetSel(id){trSel=id;rawSave('trSel',id)}
function trDiasTxt(w){var d=(w.dias||[]).slice().sort();return d.length?d.map(function(i){return SHORT[i]}).join(', '):'sem dia fixo'}
function trMeta(e){
  var p=[e.s+' × '+(e.r||'?')];
  if(e.k!=null)p.push(trFmtKg(e.k));
  if(e.d)p.push('descanso '+e.d+' s');
  return p.join(' · ');
}
function trSessionsDesc(){return wlog.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(a.id<b.id?1:-1)})}
function trLast(exId,excludeDate){
  var ss=trSessionsDesc();
  for(var i=0;i<ss.length;i++){
    if(ss[i].date===excludeDate)continue;
    for(var j=0;j<ss[i].ex.length;j++)if(ss[i].ex[j].id===exId&&ss[i].ex[j].sets.length)return {date:ss[i].date,sets:ss[i].ex[j].sets};
  }
  return null;
}
function trBest(exId){
  var best=null;
  wlog.forEach(function(s){s.ex.forEach(function(e){if(e.id!==exId)return;e.sets.forEach(function(x){
    if(x.k==null)return;
    if(!best||x.k>best.k||(x.k===best.k&&x.r>best.r))best={k:x.k,r:x.r,date:s.date};
  })})});
  return best;
}
function trSetsTxt(sets){return sets.map(function(x){return x.r+(x.k!=null?' × '+trFmtKg(x.k):'')}).join(', ')}
function trVolume(s){var v=0;s.ex.forEach(function(e){e.sets.forEach(function(x){if(x.k!=null)v+=x.r*x.k})});return Math.round(v)}
function trWeekCount(){var k0=dkey(mondayOf(today()));return wlog.filter(function(s){return s.date>=k0}).length}

function trSuggestions(){
  var map={},out=[];
  routine.forEach(function(day,i){day.forEach(function(b){
    if(b.type!=='treino')return;
    var nome=b.items.map(function(x){return String(x).trim()}).filter(Boolean).join(', ').slice(0,60);
    if(!nome)return;
    if(!map[nome]){map[nome]={nome:nome,dias:[]};out.push(map[nome])}
    if(map[nome].dias.indexOf(i)<0)map[nome].dias.push(i);
  })});
  return out.filter(function(s){return !workouts.some(function(w){return w.nome.toLowerCase()===s.nome.toLowerCase()})});
}
function trDiasChips(sel){
  return '<div><span class="lbl" style="font-size:13px;font-weight:700;color:var(--ink-soft)">Dias da semana (opcional)</span><div class="chips" style="margin-top:6px">'+
    SHORT.map(function(d,i){return '<label class="chip"><input type="checkbox" name="dias" value="'+i+'"'+((sel||[]).indexOf(i)>=0?' checked':'')+'>'+d+'</label>'}).join('')+'</div></div>';
}
function trNewPanel(){
  var sug=trSuggestions(),h='<form class="panel form" id="trNewForm"><h3>Novo treino</h3>';
  if(!workouts.length)h+='<p class="hint" style="margin:0">Crie um treino para cada dia, por exemplo Peito e tríceps. Depois adicione os exercícios com séries, repetições e carga, registre o que fez e acompanhe a evolução.</p>';
  if(sug.length){
    h+='<div><span class="lbl" style="font-size:13px;font-weight:700;color:var(--ink-soft)">Da sua rotina (toque para criar)</span><div class="chips" style="margin-top:6px">';
    sug.forEach(function(s,i){h+='<button type="button" class="chip" data-act="tr-sug" data-i="'+i+'">'+esc(s.nome)+' <small>'+s.dias.map(function(d){return SHORT[d]}).join(', ')+'</small></button>'});
    h+='</div>'+(sug.length>1?'<button type="button" class="link" data-act="tr-sug-all" style="margin-top:6px">Criar todos os '+sug.length+'</button>':'')+'</div>';
  }
  h+='<label class="f">Nome do treino<input name="nome" maxlength="60" required placeholder="Ex.: Peito e tríceps"></label>';
  h+=trDiasChips([]);
  h+='<div class="row" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="submit">Criar treino</button>'+(workouts.length?'<button class="btn ghost" type="button" data-act="tr-newcancel">Cancelar</button>':'')+'</div></form>';
  return h;
}
function trExFields(e){
  e=e||{s:3,r:'10',k:null,d:60,o:''};
  var h='<label class="f">Exercício<input name="nome" maxlength="60" required placeholder="Ex.: Supino reto" value="'+esc(e.nome||'')+'"></label>';
  h+='<div class="grid5" style="grid-template-columns:repeat(4,minmax(0,1fr))">';
  h+='<label class="f">Séries<input type="number" name="s" inputmode="numeric" min="1" max="20" value="'+esc(e.s)+'" required></label>';
  h+='<label class="f">Reps<input name="r" maxlength="12" placeholder="10 ou 8-12" value="'+esc(e.r||'')+'"></label>';
  h+='<label class="f">Carga (kg)<input name="k" inputmode="decimal" placeholder="vazio = peso do corpo" value="'+(e.k==null?'':esc(String(e.k).replace('.',',')))+'"></label>';
  h+='<label class="f">Descanso (s)<input type="number" name="d" inputmode="numeric" min="0" max="900" step="5" value="'+(e.d?esc(e.d):'')+'"></label></div>';
  h+='<label class="f">Observação (opcional)<input name="o" maxlength="140" placeholder="Ex.: pegada fechada, ritmo 2-0-2" value="'+esc(e.o||'')+'"></label>';
  return h;
}
function trPlanPanel(w){
  var h='<div class="panel"><h3>'+esc(w.nome)+'</h3><p class="hint" style="margin:0 0 8px">'+esc(trDiasTxt(w))+' · '+w.ex.length+(w.ex.length===1?' exercício':' exercícios')+'</p>';
  if(!w.ex.length)h+='<p class="empty">Nenhum exercício ainda. Adicione o primeiro abaixo.</p>';
  else{
    h+='<ul class="errlist" style="margin-top:0">';
    w.ex.forEach(function(e,i){
      if(trEdit===e.id){
        h+='<li style="display:block"><form class="form" id="trExForm"><input type="hidden" name="eid" value="'+esc(e.id)+'">'+trExFields(e)+'<div class="row" style="display:flex;gap:8px"><button class="btn sm" type="submit">Salvar</button><button class="btn sm ghost" type="button" data-act="tr-excancel">Cancelar</button></div></form></li>';
        return;
      }
      h+='<li><div><b>'+(i+1)+'. '+esc(e.nome)+'</b><div class="errmeta">'+esc(trMeta(e))+'</div>'+(e.o?'<div class="errnote">'+esc(e.o)+'</div>':'')+'</div>';
      h+='<div class="acts"><button class="btn sm ghost" data-act="tr-exup" data-id="'+esc(e.id)+'" aria-label="Mover '+esc(e.nome)+' para cima"'+(i===0?' disabled':'')+'>↑</button>';
      h+='<button class="btn sm ghost" data-act="tr-exdown" data-id="'+esc(e.id)+'" aria-label="Mover '+esc(e.nome)+' para baixo"'+(i===w.ex.length-1?' disabled':'')+'>↓</button>';
      h+='<button class="btn sm ghost" data-act="tr-exedit" data-id="'+esc(e.id)+'">Editar</button><button class="btn sm danger" data-act="tr-exdel" data-id="'+esc(e.id)+'">Apagar</button></div></li>';
    });
    h+='</ul>';
  }
  h+='<form class="form" id="trExAddForm" style="margin-top:14px;border-top:1.5px solid var(--line);padding-top:14px"><h4 class="sub" style="margin:0">Adicionar exercício</h4><input type="hidden" name="eid" value="">'+trExFields(null)+'<div><button class="btn" type="submit">Adicionar exercício</button></div></form>';
  h+='<details class="grp" style="margin-top:12px"><summary><span class="t">Configurações do treino</span></summary>';
  h+='<form class="form" id="trMetaForm" style="margin-top:10px"><label class="f">Nome do treino<input name="nome" maxlength="60" required value="'+esc(w.nome)+'"></label>'+trDiasChips(w.dias)+'<div><button class="btn sm" type="submit">Salvar</button></div></form>';
  h+='<div class="row" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn sm ghost" data-act="tr-dup">Duplicar treino</button><button class="btn sm danger" data-act="tr-wdel">Apagar treino</button></div>';
  h+='<p class="hint" style="margin:10px 0 0">Apagar um treino não apaga o histórico que você já registrou.</p></details></div>';
  return h;
}

/* ---- Registrar o treino de hoje ---- */
function trDraft(w){
  var d=load('trdraft',null),ok=!!d&&d.wid===w.id&&d.date===tk();
  var ses=wlog.filter(function(s){return s.wid===w.id&&s.date===tk()})[0];
  if(!ok)d={wid:w.id,date:tk(),obs:ses?(ses.obs||''):'',sets:{}};
  w.ex.forEach(function(e){
    if(ok&&d.sets[e.id])return;                    // já tem rascunho deste exercício
    var base=null;
    if(ses){var f=ses.ex.filter(function(x){return x.id===e.id})[0];if(f)base=f.sets}
    if(!base){var l=trLast(e.id,tk());if(l)base=l.sets}
    if(!base){var n=Math.max(1,e.s||1);base=[];for(var i=0;i<n;i++)base.push({r:/^\d+$/.test(e.r||'')?e.r:'',k:e.k})}
    d.sets[e.id]=base.map(function(s){return {r:s.r==null?'':String(s.r),k:s.k==null?'':String(s.k).replace('.',',')}});
  });
  return d;
}
function trReadDraft(w){
  var d=trDraft(w),f=document.getElementById('trSessForm');
  if(!f)return d;
  w.ex.forEach(function(e){
    (d.sets[e.id]||[]).forEach(function(s,i){
      var r=f.elements['r|'+e.id+'|'+i],k=f.elements['k|'+e.id+'|'+i];
      if(r)s.r=r.value;if(k)s.k=k.value;
    });
  });
  if(f.elements.obs)d.obs=f.elements.obs.value;
  return d;
}
function trRegPanel(w){
  var done=wlog.filter(function(s){return s.wid===w.id&&s.date===tk()})[0];
  if(!w.ex.length)return '<div class="panel"><h3>'+esc(w.nome)+'</h3><p class="empty">Adicione exercícios na aba Plano para poder registrar o treino.</p><button class="btn sm" data-act="tr-tab" data-v="plano" style="margin-top:12px">Ir para o Plano</button></div>';
  var d=trDraft(w);
  var h='<form class="stack" id="trSessForm"><div class="panel"><h3>'+esc(w.nome)+' · hoje</h3><p class="hint" style="margin:0">'+(done?'Treino de hoje já salvo. Você pode ajustar e salvar de novo.':'Os campos já vêm com o que você fez da última vez. Ajuste, deixe em branco as séries que não fez e salve no fim.')+'</p></div>';
  w.ex.forEach(function(e,ei){
    var l=trLast(e.id,tk()),b=trBest(e.id),rows=d.sets[e.id]||[];
    h+='<div class="panel wex"><h3>'+esc(e.nome)+'</h3><p class="hint" style="margin:0 0 6px">Meta: '+esc(trMeta(e))+'</p>';
    if(l)h+='<p class="errmeta" style="margin:0 0 2px">Última vez ('+esc(shortDate(l.date))+'): '+esc(trSetsTxt(l.sets))+'</p>';
    if(b)h+='<p class="errmeta" style="margin:0 0 8px">Recorde de carga: '+esc(trFmtKg(b.k))+' × '+b.r+'</p>';
    if(e.o)h+='<p class="errnote" style="margin:0 0 8px">'+esc(e.o)+'</p>';
    h+='<div class="wset wh" aria-hidden="true"><span></span><span>Reps</span><span>Carga (kg)</span><span></span></div>';
    rows.forEach(function(s,i){
      h+='<div class="wset"><span>Série '+(i+1)+'</span><input name="r|'+esc(e.id)+'|'+i+'" inputmode="numeric" placeholder="reps" aria-label="Repetições da série '+(i+1)+' de '+esc(e.nome)+'" value="'+esc(s.r)+'"><input name="k|'+esc(e.id)+'|'+i+'" inputmode="decimal" placeholder="kg" aria-label="Carga em kg da série '+(i+1)+' de '+esc(e.nome)+'" value="'+esc(s.k)+'"><button type="button" class="btn sm ghost" data-act="tr-setdel" data-e="'+esc(e.id)+'" data-i="'+i+'" aria-label="Remover série '+(i+1)+'">×</button></div>';
    });
    h+='<button type="button" class="link" data-act="tr-setadd" data-e="'+esc(e.id)+'" style="margin-top:6px">+ série</button></div>';
  });
  h+='<div class="panel"><label class="f">Como foi o treino? (opcional)<textarea name="obs" rows="2" maxlength="400" placeholder="Sono, energia, dor, o que mudar na próxima...">'+esc(d.obs)+'</textarea></label><div style="margin-top:12px"><button class="btn" type="submit">'+(done?'Atualizar treino de hoje':'Salvar treino de hoje')+'</button></div></div></form>';
  return h;
}

/* ---- Histórico e evolução ---- */
function trHistPanel(w){
  var ss=trSessionsDesc().filter(function(s){return s.wid===w.id});
  var h='<div class="panel"><h3>Evolução de carga</h3>';
  var any=false;
  w.ex.forEach(function(e){
    var pts=[];
    wlog.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0}).forEach(function(s){
      if(s.wid!==w.id)return;
      s.ex.forEach(function(x){if(x.id!==e.id)return;var m=null;x.sets.forEach(function(y){if(y.k!=null&&(m==null||y.k>m))m=y.k});if(m!=null)pts.push(m)});
    });
    var b=trBest(e.id);
    if(!b){h+='<div class="mrow"><span>'+esc(e.nome)+'</span><span class="errmeta" style="margin:0">sem carga registrada</span><b></b></div>';return}
    any=true;
    var diff=pts[pts.length-1]-pts[0];
    h+='<div class="mrow"><span>'+esc(e.nome)+'</span><span class="errmeta" style="margin:0">'+(pts.length>1?esc(trFmtKg(pts[0]))+' → '+esc(trFmtKg(pts[pts.length-1]))+(diff?' ('+(diff>0?'+':'')+esc(trFmtKg(diff))+')':''):'primeiro registro')+'</span><b>'+esc(trFmtKg(b.k))+'</b></div>';
  });
  if(!w.ex.length)h+='<p class="empty">Sem exercícios neste treino.</p>';
  else h+='<p class="hint" style="margin:10px 0 0">À direita, o recorde de carga de cada exercício.</p>';
  h+='</div><div class="panel"><h3>Treinos registrados</h3>';
  if(!ss.length)return h+'<p class="empty">Nenhum treino registrado em "'+esc(w.nome)+'" ainda.</p></div>';
  ss.slice(0,20).forEach(function(s){
    var sets=0;s.ex.forEach(function(e){sets+=e.sets.length});var vol=trVolume(s);
    h+='<details class="grp"><summary><span class="t">'+esc(shortDate(s.date))+'</span><span class="c">'+s.ex.length+(s.ex.length===1?' exercício':' exercícios')+' · '+sets+' séries'+(vol?' · '+vol.toLocaleString('pt-BR')+' kg de volume':'')+'</span></summary>';
    h+='<ul class="errlist" style="margin-top:6px">'+s.ex.map(function(e){return '<li><div><b>'+esc(e.nome)+'</b><div class="errmeta">'+esc(trSetsTxt(e.sets))+'</div></div></li>'}).join('')+'</ul>';
    if(s.obs)h+='<p class="errnote">'+esc(s.obs)+'</p>';
    h+='<button class="btn sm danger" data-act="tr-sesdel" data-id="'+esc(s.id)+'" style="margin-top:8px">Apagar este registro</button></details>';
  });
  if(ss.length>20)h+='<p class="hint" style="margin:10px 0 0">Mostrando os 20 mais recentes de '+ss.length+'.</p>';
  return h+'</div>';
}

function renderTreinos(){
  var h='<div class="stack">';
  var cur=trCur();
  h+='<div class="panel"><div class="split"><div class="row"><span>Treinos registrados esta semana</span><span>'+trWeekCount()+'</span></div><div class="row"><span>Total registrado</span><span>'+wlog.length+'</span></div></div></div>';
  h+='<div class="chips" role="group" aria-label="Meus treinos">'+workouts.map(function(w){
    return '<button class="chip" data-act="tr-sel" data-id="'+esc(w.id)+'" aria-pressed="'+(!!cur&&cur.id===w.id&&!trNew)+'">'+esc(w.nome)+' <small>'+w.ex.length+'</small></button>';
  }).join('')+'<button class="chip" data-act="tr-new" aria-pressed="'+(trNew||!workouts.length)+'">+ Novo treino</button></div>';
  if(!workouts.length||trNew||!cur)return h+trNewPanel()+'</div>';
  var tab=['plano','registrar','historico'].indexOf(trTab)>=0?trTab:'registrar';
  h+='<div class="chips" role="group" aria-label="Seção do treino">'+[['registrar','Registrar hoje'],['plano','Plano'],['historico','Histórico']].map(function(t){
    return '<button class="chip" data-act="tr-tab" data-v="'+t[0]+'" aria-pressed="'+(tab===t[0])+'">'+t[1]+'</button>';
  }).join('')+'</div>';
  h+=tab==='plano'?trPlanPanel(cur):tab==='historico'?trHistPanel(cur):trRegPanel(cur);
  return h+'</div>';
}

function trMake(nome,dias){
  var w={id:uid(),nome:nome,dias:dias,ex:[]};workouts.push(w);trSave();trSetSel(w.id);trNew=false;trTab='plano';rawSave('trTab',trTab);return w;
}
function trAction(a,b){
  if(!/^tr-/.test(a))return false;
  var w=trCur(),id=b.dataset.id;
  if(a==='tr-open'){var t=trToday();if(t){trSetSel(t.id);trTab='registrar';rawSave('trTab',trTab)}trNew=false;go('treinos');return true}
  if(a==='tr-sel'){trSetSel(id);trNew=false;trEdit='';render();return true}
  if(a==='tr-new'){trNew=true;render();return true}
  if(a==='tr-newcancel'){trNew=false;render();return true}
  if(a==='tr-tab'){if(w&&trTab==='registrar')rawSave('trdraft',trReadDraft(w));trTab=b.dataset.v;rawSave('trTab',trTab);trEdit='';render();return true}
  if(a==='tr-sug'){var s=trSuggestions()[+b.dataset.i];if(s){trMake(s.nome,s.dias);render();toast('Treino criado. Adicione os exercícios.')}return true}
  if(a==='tr-sug-all'){var all=trSuggestions();all.forEach(function(s){trMake(s.nome,s.dias)});if(all.length){trSetSel(workouts[workouts.length-all.length].id);}render();toast(all.length+' treinos criados');return true}
  if(!w)return true;
  if(a==='tr-exedit'){trEdit=id;render();return true}
  if(a==='tr-excancel'){trEdit='';render();return true}
  if(a==='tr-exup'||a==='tr-exdown'){

/* ---------- banco de palavras ---------- */
function vocId(){return 'v'+Date.now().toString(36)+(vocSeq++).toString(36)+Math.random().toString(36).slice(2,4)}
function vocNorm(w){return String(w||'').toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ').trim()}
function vocFind(w){var n=vocNorm(w);for(var i=0;i<vocab.length;i++)if(vocNorm(vocab[i].w)===n)return vocab[i];return null}
function vocSave(){save('vocab',vocab)}
function vocAdd(o,known){
  var w=String(o.w||'').trim().slice(0,60);if(!w||vocFind(w))return null;
  var x={i:vocId(),w:w,t:String(o.t||'').trim().slice(0,120),e:String(o.e||'').trim().slice(0,200),c:String(o.c||'').trim().slice(0,24),ipa:String(o.ipa||'').trim().slice(0,40),k:known?1:0,b:0,d:known?'':tk(),a:tk(),n:0,f:0};
  vocab.push(x);return x;
}
function vocDue(){var t=tk();return vocab.filter(function(x){return x.k!==1&&(x.d||t)<=t}).sort(function(a,b){return (a.d||'')<(b.d||'')?-1:(a.d||'')>(b.d||'')?1:(a.b||0)-(b.b||0)})}
function vocStats(){
  var k=0,l=0,m=0,due=0,rev=0,t=tk();
  vocab.forEach(function(x){if(x.k===1)k++;else{l++;if((x.b||0)>=4)m++;if((x.d||t)<=t)due++}if(x.l===t)rev++});
  return {total:vocab.length,known:k,learning:l,mastered:m,due:due,revToday:rev,size:k+m};
}
function vocGrade(x,g){
  x.n=(x.n||0)+1;x.l=tk();
  if(g===0){x.f=(x.f||0)+1;x.b=Math.max(0,(x.b||0)-2);x.d=dkey(addDays(today(),1))}
  else{x.b=Math.min(6,(x.b||0)+(g===2?2:1));x.d=dkey(addDays(today(),ING_BOX[Math.max(0,Math.min(6,x.b-1))]))}
}
function vocParse(txt){
  var out=[],seen={};
  String(txt||'').split(/\r?\n/).forEach(function(line){
    line=line.trim();if(!line)return;
    var sep=/\s+[-–—]\s+|\t|;|=|\s*->\s*|\s:\s/.exec(line);
    var parts=[];
    if(sep){parts.push({w:line.slice(0,sep.index),t:line.slice(sep.index+sep[0].length)})}
    else if(line.indexOf(',')>=0&&line.split(',').length>1&&line.length<400){line.split(',').forEach(function(p){parts.push({w:p,t:''})})}
    else parts.push({w:line,t:''});
    parts.forEach(function(p){
      var w=p.w.replace(/^\s*(?:[-*\u2022]\s+|\d+[.)]\s+)/,'').trim();
      if(!w||w.length>60)return;
      var n=vocNorm(w);if(seen[n])return;seen[n]=1;
      out.push({w:w,t:p.t.trim()});
    });
  });
  return out.slice(0,600);
}

/* ---------- caderno de erros ---------- */
function ierId(){return 'x'+Date.now().toString(36)+(vocSeq++).toString(36)+Math.random().toString(36).slice(2,4)}
function ierAdd(o){
  var key=(String(o.p)+'|'+String(o.a)).toLowerCase().trim();

  return true;
}
function ierDue(){var t=tk();return ingErr.filter(function(e){return (e.b||0)<5&&(e.d||t)<=t})}
function ierGrade(e,ok){
  e.n=(e.n||0)+1;e.l=tk();
  if(!ok){e.b=Math.max(0,(e.b||0)-2);e.d=dkey(addDays(today(),1))}
  else{e.b=Math.min(6,(e.b||0)+1);e.d=dkey(addDays(today(),ING_BOX[Math.max(0,Math.min(6,e.b-1))]))}
}
function ierCats(){
  var c={};ingErr.forEach(function(e){if((e.b||0)<5)c[e.cat]=(c[e.cat]||0)+1});

/* ---------- imersão ---------- */
function ingLogAdd(sk,min,nota,date){
  min=clamp(min,1,600);if(!min||!ING_SK.some(function(s){return s[0]===sk}))return false;
  ingLog.push({id:uid(),date:date||tk(),sk:sk,min:min,n:String(nota||'').trim().slice(0,100)});

}
function ingDayMap(){var m={};ingLog.forEach(function(e){m[e.date]=(m[e.date]||0)+e.min});return m}
function ingStreak(){
  var m=ingDayMap(),d=today(),n=0;
  if((m[dkey(d)]||0)<10)d=addDays(d,-1);
  while((m[dkey(d)]||0)>=10){n++;d=addDays(d,-1)}
  return n;
}
function ingBestStreak(){
  var m=ingDayMap(),ks=Object.keys(m).filter(function(k){return m[k]>=10}).sort(),best=0,run=0,prev=null;
  ks.forEach(function(k){run=prev&&daysBetween(pk(prev),pk(k))===1?run+1:1;if(run>best)best=run;prev=k});
  return best;
}
function ingRange(from,to){
  var by={o:0,f:0,l:0,e:0,v:0},tot=0;
  ingLog.forEach(function(e){if(e.date>=from&&e.date<=to){by[e.sk]=(by[e.sk]||0)+e.min;tot+=e.min}});
  return {by:by,tot:tot};
}
function ingWeek(off){var mon=addDays(mondayOf(new Date()),(off||0)*7);return ingRange(dkey(mon),dkey(addDays(mon,6)))}

/* ---------- correção automática dos exercícios ---------- */
function exNorm(s){return String(s||'').toLowerCase().replace(/[’‘`´]/g,"'").replace(/[“”]/g,'"').replace(/[.,!?;:"]/g,'').replace(/\s+/g,' ').trim()}
function exGrade(it,ans){
  var a=exNorm(ans);if(!a)return 'no';
  var ok=[it.resposta].concat(it.aceitas||[]).map(exNorm);
  if(ok.indexOf(a)>=0)return 'ok';
  return it.tipo==='traducao'?'rev':'no';
}
function iexWords(){return vocab.filter(function(x){return x.k!==1}).sort(function(a,b){return ((b.f||0)-(a.f||0))||((a.b||0)-(b.b||0))}).slice(0,10).map(function(x){return x.w})}
function iexErrs(){return ingErr.filter(function(e){return (e.b||0)<5}).slice(-6).map(function(e){return e.cat+': '+e.p.replace(/^(Corrija|Traduza|Ordene): /,'')+' → '+e.a})}
function iexCheck(){
  var s=iexSess;if(!s||s.checked)return;
  s.res=s.itens.map(function(it,i){return exGrade(it,s.resp[i])});
  s.checked=true;
  if(s.res.indexOf('rev')<0)iexFinalize();
  rawSave('ingSess',s);render();window.scrollTo(0,0);
}
function iexFinalize(){
  var s=iexSess;if(!s||s.fin)return;s.fin=true;
  var R=iexResult(),added=0;
  s.itens.forEach(function(it,i){if(s.res[i]==='no'&&ierAdd({cat:it.categoria||'geral',p:iexPrompt(it),a:it.resposta,y:it.explicacao,src:'ex'}))added++});
  if(added)save('ingErr',ingErr);
  ingEx.push({id:uid(),date:tk(),titulo:String(s.titulo).slice(0,60),foco:s.foco,nivel:s.nivel,ok:R.ok,total:R.total});
  if(ingEx.length>40)ingEx=ingEx.slice(-40);
  save('ingEx',ingEx);
  if(s.foco==='nivel')ingCfgSave({teste:tk()});
  toast(added?added+(added===1?' erro foi para o seu caderno':' erros foram para o seu caderno'):'Lista concluída');
}

    iexSess={titulo:d.titulo,texto:d.texto||'',foco:o.foco,nivel:o.nivel,tema:o.tema,itens:d.itens,resp:d.itens.map(function(){return ''}),res:d.itens.map(function(){return null}),checked:false,fin:false};

async function vocFillAI(words){
  var list=words.filter(function(x){return !x.t}).slice(0,25);if(!list.length)return;
  ingBusy='pal';ingMsg='';render();
  try{
    var d=await ingCall({acao:'palavras',palavras:list.map(function(x){return x.w})});
    var n=0;
    d.palavras.forEach(function(p,i){
      var x=list[i];if(!x)return;
      if(vocNorm(p.w)!==vocNorm(x.w)){var f=list.filter(function(y){return vocNorm(y.w)===vocNorm(p.w)})[0];if(!f)return;x=f}
      if(!x.t){x.t=p.t;n++}if(!x.e)x.e=p.e||'';if(!x.c)x.c=p.c||'';if(!x.ipa)x.ipa=p.ipa||'';
    });
    vocSave();toast(n+(n===1?' palavra completada':' palavras completadas'));
  }catch(e){ingMsg=(e&&e.message)||'Não foi possível completar as palavras.'}
  ingBusy='';render();
}

/* ---------- conversa ---------- */
async function chatTurn(){
  ingBusy='chat';ingMsg='';render();
  try{
    var d=await ingCall({acao:'conversa',cenario:chat.cen,nivel:chat.nivel,msgs:chat.msgs.slice(-12).map(function(m){return {r:m.r,t:m.t}})});
    var last=chat.msgs[chat.msgs.length-1];
    if(last&&last.r==='u'){
      last.corr=d.correcoes;last.ck=!d.correcoes.length;
      var added=0;d.correcoes.forEach(function(c){if(ierAdd({cat:c.categoria||'conversa',p:'Corrija: '+c.original,a:c.corrigido,y:c.explicacao,src:'chat'}))added++});
      if(added)save('ingErr',ingErr);
    }
    chat.msgs.push({r:'a',t:d.resposta,tr:d.traducao});
    chat.sug=d.sugestao||'';
    ingBusy='';rawSave('ingChat',chat);render();
    var box=document.getElementById('chatBox');if(box)box.scrollTop=box.scrollHeight;
    var inp=document.getElementById('chatMsg');if(inp&&!window.matchMedia('(pointer:coarse)').matches)inp.focus();
    return;
  }catch(e){ingMsg=(e&&e.message)||'Não foi possível falar com a IA.';if(!chat.msgs.length)chat=null}
  ingBusy='';rawSave('ingChat',chat);render();
}
var ingRec=null;
function ingMic(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('Seu navegador não tem reconhecimento de voz.');return}
  try{
    if(ingRec){ingRec.stop();ingRec=null;return}
    var r=new SR();r.lang=ingC().sotaque==='uk'?'en-GB':'en-US';r.interimResults=false;r.maxAlternatives=1;
    r.onresult=function(ev){var t=ev.results[0][0].transcript,inp=document.getElementById('chatMsg');if(inp)inp.value=(inp.value?inp.value+' ':'')+t;if(chat){chat.mic=true;rawSave('ingChat',chat)}};
    r.onerror=function(){toast('Não consegui ouvir. Confira a permissão do microfone.')};
    r.onend=function(){ingRec=null};
    ingRec=r;r.start();
  }catch(e){toast('Não foi possível usar o microfone.')}
}

/* ---------- ações ---------- */
function ingAction(a,b){
  if(!/^ing-/.test(a))return false;
  var id=b.dataset.id;
  if(a==='ing-tab'||a==='ing-go'){ingTab=b.dataset.v;rawSave('ingTab',ingTab);ingMsg='';trailEdit=false;render();window.scrollTo(0,0);return true}
  if(a==='ing-open-topic'){var t=TOPICS[b.dataset.v];if(t){setSel('ing',t.materia);ingTab='trilha';rawSave('ingTab',ingTab);trailEdit=false;contentFilter='todos';render();window.scrollTo(0,0)}return true}
  if(a==='ing-say'){if(!ingSay(b.dataset.say,!!b.dataset.slow))toast('Seu aparelho não tem voz em inglês disponível.');return true}

  /* palavras */
  if(a==='ing-voc-filter'){vocFilter=b.dataset.v;vocLimit=40;render();return true}
  if(a==='ing-voc-more'){vocLimit+=40;render();return true}
  if(a==='ing-voc-toggle'){
    var x=vocab.filter(function(v){return v.i===id})[0];if(!x)return true;
    if(x.k===1){x.k=0;x.b=0;x.d=tk()}else{x.k=1;x.d=''}
    vocSave();render();return true;
  }
  if(a==='ing-voc-del'){
    var y=vocab.filter(function(v){return v.i===id})[0];if(!y)return true;
    if(!confirm('Apagar a palavra "'+y.w+'" do banco?'))return true;
    vocab=vocab.filter(function(v){return v.i!==id});vocSave();render();return true;
  }
  if(a==='ing-voc-start'){
    var q=vocDue().slice(0,20).map(function(v){return v.i});
    if(!q.length)return true;
    vocRev={q:q,i:0,shown:false,dir:b.dataset.dir==='pt'?'pt':'en',done:0,ok:0,req:{}};render();return true;
  }
  if(a==='ing-voc-show'){if(vocRev){vocRev.shown=true;render()}return true}
  if(a==='ing-voc-grade'){
    if(!vocRev)return true;
    var vid=vocRev.q[vocRev.i],vx=vocab.filter(function(v){return v.i===vid})[0],g=+b.dataset.g;
    if(vx){
      vocGrade(vx,g);vocSave();vocRev.done++;if(g>0)vocRev.ok++;
      if(g===0&&!vocRev.req[vid]){vocRev.req[vid]=1;vocRev.q.push(vid)}
    }
    vocRev.i++;vocRev.shown=false;render();return true;
  }
  if(a==='ing-voc-end'){vocRev=null;render();return true}
  if(a==='ing-voc-fill'){vocFillAI(vocab.filter(function(v){return !v.t}));return true}
  if(a==='ing-sug'){
    var i=+b.dataset.i,s=vocSug[i],v=b.dataset.v;
    if(s){if(v==='learn')vocAdd(s,false);else if(v==='know')vocAdd(s,true);vocSug.splice(i,1);vocSave();render()}
    return true;
  }
  if(a==='ing-sug-all'){var n=0;vocSug.forEach(function(s){if(vocAdd(s,false))n++});vocSug=[];vocSave();render();toast(n+(n===1?' palavra adicionada':' palavras adicionadas'));return true}
  if(a==='ing-sug-clear'){vocSug=[];render();return true}

  /* exercícios */
  if(a==='ing-ex-topic'){var inp=document.querySelector('#iexGenForm [name="tema"]');if(inp){inp.value=b.dataset.v;inp.focus()}return true}
  if(a==='ing-ex-nivel'){if(!ingBusy)ingGenEx({foco:'nivel',tema:'',nivel:'B1',qtd:12});return true}
  if(a==='ing-ex-self'){
    if(!iexSess)return true;
    iexSess.res[+b.dataset.i]=b.dataset.v;
    if(iexSess.res.indexOf('rev')<0)iexFinalize();
    rawSave('ingSess',iexSess);render();return true;
  }
  if(a==='ing-ex-drop'){iexSess=null;rawSave('ingSess',null);render();return true}
  if(a==='ing-ex-redo'){
    var s0=iexSess;if(!s0)return true;
    var keep=s0.itens.filter(function(it,k){return s0.res[k]==='no'});
    if(!keep.length)return true;
    iexSess={titulo:'Refazendo: '+s0.titulo,texto:s0.texto,foco:s0.foco==='nivel'?'misto':s0.foco,nivel:s0.nivel,tema:s0.tema,itens:keep,resp:keep.map(function(){return ''}),res:keep.map(function(){return null}),checked:false,fin:false};
    rawSave('ingSess',iexSess);render();window.scrollTo(0,0);return true;
  }
  if(a==='ing-ex-aplicar'){ingCfgSave({nivel:b.dataset.v});render();toast('Nível atualizado para '+b.dataset.v);return true}

  /* escrita */
  if(a==='ing-wr-add'){
    var p=iwrRes&&iwrRes.palavras[+b.dataset.i];
    if(p){if(vocAdd({w:p.w,t:p.t,e:p.e},false)){vocSave();toast('Palavra adicionada ao banco')}else toast('Essa palavra já está no banco');render()}
    return true;
  }
  if(a==='ing-wr-clear'){iwrRes=null;render();return true}
  if(a==='ing-log-q'){if(ingLogAdd(b.dataset.sk,b.dataset.min,b.dataset.n)){toast(b.dataset.min+' min registrados na imersão');render()}return true}

  /* conversa */
  if(a==='ing-chat-tr'){var m=chat&&chat.msgs[+b.dataset.i];if(m){m.show=!m.show;rawSave('ingChat',chat);render()}return true}
  if(a==='ing-chat-retry'){if(chat&&!ingBusy)chatTurn();return true}
  if(a==='ing-chat-drop'){if(confirm('Descartar esta conversa sem registrar o tempo?')){chat=null;rawSave('ingChat',null);ingMsg='';render()}return true}
  if(a==='ing-chat-end'){
    if(!chat)return true;
    var mins=Math.max(1,Math.min(45,Math.round((Date.now()-(chat.t0||Date.now()))/60000)));
    var r=prompt('Quantos minutos registrar na sua imersão?',String(mins));
    if(r===null)return true;
    var mm=clamp(r,1,600);
    if(mm)ingLogAdd(chat.mic?'f':'e',mm,'Conversa com IA: '+chat.cen);
    ingCfgSave({chats:ingC().chats+1});
    chat=null;rawSave('ingChat',null);ingMsg='';render();toast(mm?mm+' min registrados':'Conversa encerrada');return true;
  }
  if(a==='ing-mic'){ingMic();return true}

  /* erros */
  if(a==='ing-err-start'){
    var q2=ierDue().sort(function(x,y){return (x.b||0)-(y.b||0)}).slice(0,15).map(function(e){return e.i});
    if(q2.length){ierRev={q:q2,i:0,shown:false,done:0,ok:0,req:{}};render()}
    return true;
  }
  if(a==='ing-err-show'){if(ierRev){ierRev.shown=true;render()}return true}
  if(a==='ing-err-grade'){
    if(!ierRev)return true;
    var eid=ierRev.q[ierRev.i],ex=ingErr.filter(function(e){return e.i===eid})[0],ok=b.dataset.g==='1';
    if(ex){
      ierGrade(ex,ok);save('ingErr',ingErr);ierRev.done++;if(ok)ierRev.ok++;
      if(!ok&&!ierRev.req[eid]){ierRev.req[eid]=1;ierRev.q.push(eid)}
    }
    ierRev.i++;ierRev.shown=false;render();return true;
  }
  if(a==='ing-err-end'){ierRev=null;render();return true}
  if(a==='ing-err-filter'){ierFilter=b.dataset.v;render();return true}
  if(a==='ing-err-del'){ingErr=ingErr.filter(function(e){return e.i!==id});save('ingErr',ingErr);render();return true}

  /* imersão */
  if(a==='ing-log-del'){ingLog=ingLog.filter(function(e){return e.id!==id});save('ingLog',ingLog);render();return true}
  return true;
}

/* ---------- formulários ---------- */
function ingSubmit(f,fd){
  var id=f.id;
  if(id==='ingCfgForm'){
    var meta=clamp(fd.get('meta'),30,3000);if(!meta){toast('Informe a meta semanal em minutos');return true}
    ingCfgSave({nivel:fd.get('nivel'),alvo:fd.get('alvo'),meta:meta,sotaque:fd.get('sotaque')});
    render();toast('Configurações salvas');return true;
  }
  if(id==='vocForm'){
    var w=String(fd.get('w')||'').trim();
    var x=vocAdd({w:w,t:fd.get('t'),e:fd.get('e')},fd.get('modo')==='conheco');
    if(!x){toast(w?'Essa palavra já está no banco':'Escreva a palavra');return true}
    vocSave();render();toast(x.k===1?'Palavra adicionada ao seu vocabulário':'Palavra adicionada às revisões');keepFocus('#vocForm input[name="w"]');return true;
  }
  if(id==='vocBulkForm'){
    var rows=vocParse(fd.get('lista')),known=fd.get('modo')==='conheco',added=[],dup=0;
    rows.forEach(function(r){var x=vocAdd(r,known);if(x)added.push(x);else dup++});
    if(added.length)vocSave();
    render();
    toast(added.length+(added.length===1?' palavra adicionada':' palavras adicionadas')+(dup?' · '+dup+' já existiam':''));
    if(fd.get('ia')&&added.length)vocFillAI(added);
    return true;
  }
  if(id==='vocSugForm'){
    if(ingBusy)return true;
    var tema=String(fd.get('tema')||'').trim();if(!tema)return true;
    ingBusy='sug';ingMsg='';render();
    ingCall({acao:'palavras',tema:tema,nivel:fd.get('nivel'),qtd:10}).then(function(d){
      vocSug=d.palavras.filter(function(p){return !vocFind(p.w)});
      if(!vocSug.length)ingMsg='Todas as palavras sugeridas já estão no seu banco. Tente outro tema.';
    }).catch(function(e){ingMsg=(e&&e.message)||'Não foi possível sugerir palavras.'}).then(function(){ingBusy='';render()});
    return true;
  }
  if(id==='iexGenForm'){
    if(ingBusy)return true;
    var learn=vocab.filter(function(v){return v.k!==1}).length;
    iexForm={foco:fd.get('foco'),tema:String(fd.get('tema')||'').trim(),nivel:fd.get('nivel'),qtd:+fd.get('qtd')||8,pal:!!fd.get('pal'),err:!!fd.get('err')};
    ingGenEx({foco:iexForm.foco,tema:iexForm.tema,nivel:iexForm.nivel,qtd:iexForm.qtd,palavras:iexForm.pal&&learn>=3?iexWords():[],erros:iexForm.err?iexErrs():[]});
    return true;
  }
  if(id==='iexForm'){iexCheck();return true}
  if(id==='iwrForm'){
    if(ingBusy)return true;
    var texto=String(fd.get('texto')||'').trim();
    if(texto.length<15){toast('Escreva um texto um pouco maior (pelo menos uma frase).');return true}
    rawSave('ingdraft',texto);
    ingBusy='corr';ingMsg='';render();
    ingCall({acao:'corrigir',texto:texto,nivel:fd.get('nivel'),objetivo:fd.get('obj')}).then(function(d){
      iwrRes=d;
      var added=0;d.erros.forEach(function(e){if(ierAdd({cat:e.categoria||'escrita',p:'Corrija: '+e.trecho,a:e.correcao,y:e.explicacao,src:'wr'}))added++});
      if(added)save('ingErr',ingErr);
      ingWr.push({id:uid(),date:tk(),obj:String(fd.get('obj')).slice(0,30),nivel:d.nivelEstimado,w:texto.split(/\s+/).filter(Boolean).length,n:d.erros.length});
      if(ingWr.length>30)ingWr=ingWr.slice(-30);
      save('ingWr',ingWr);
      toast(added?added+(added===1?' erro foi para o seu caderno':' erros foram para o seu caderno'):'Texto corrigido');
    }).catch(function(e){ingMsg=(e&&e.message)||'Não foi possível corrigir o texto.'}).then(function(){ingBusy='';render();if(iwrRes&&!ingMsg){var p=document.querySelector('#iwrForm');if(p&&p.nextElementSibling)p.nextElementSibling.scrollIntoView({behavior:'smooth',block:'start'})}});
    return true;
  }
  if(id==='chatStartForm'){
    if(ingBusy)return true;
    var cen=fd.get('cen')==='__outra'?String(fd.get('outra')||'').trim():String(fd.get('cen'));
    if(!cen){toast('Descreva a situação da conversa');return true}
    chat={cen:cen.slice(0,160),nivel:fd.get('nivel'),msgs:[],t0:Date.now(),mic:false,sug:''};
    chatTurn();return true;
  }
  if(id==='chatForm'){
    if(ingBusy||!chat)return true;
    var msg=String(fd.get('msg')||'').trim();if(!msg)return true;
    chat.msgs.push({r:'u',t:msg.slice(0,500)});chat.sug='';
    chatTurn();return true;
  }
  if(id==='ierForm'){
    var ok=ierAdd({cat:String(fd.get('cat')||'').trim()||'geral',p:'Corrija: '+String(fd.get('p')).trim(),a:String(fd.get('a')).trim(),y:fd.get('y'),src:'manual'});
    if(ok){save('ingErr',ingErr);render();toast('Erro salvo no caderno')}else toast('Esse erro já está no caderno');
    return true;
  }
  if(id==='ingLogForm'){
    var d0=String(fd.get('date')||tk());if(d0>tk())d0=tk();
    if(ingLogAdd(fd.get('sk'),fd.get('min'),fd.get('nota'),d0)){render();toast('Imersão registrada')}else toast('Informe os minutos');
    return true;
  }
  return false;
}

main.addEventListener('change',function(e){

  if(el.id==='examDate'){exam=el.value;save('exam',exam);renderStats();return}

});
main.addEventListener('submit',function(e){
  e.preventDefault();var f=e.target,fd=new FormData(f);
  if(f.id==='aiForm'){if(!aiBusy)generatePlan(f);return}
  if(trailSubmit(f))return;

  if(metasSubmit(f,fd))return;
  if(habSubmit(f,fd))return;

function exportData(){

  KEYS.forEach(function(k){data[k]=load(k,null)});
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rotina-backup-'+tk()+'.json';
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
  toast('Backup baixado');
}
document.getElementById('importFile').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var d=JSON.parse(rd.result);if(d.app!=='minha-rotina')throw 0;
      if(d.versao===1){d['routine.v2']=null}            // backup antigo: mantém a rotina nova, importa marcações
      if(!confirm('Substituir os dados deste aparelho pelo backup?'))return;
      if(d.habitSync===true){rawSave('habitSync',true);syncHabitKey()}
      KEYS.forEach(function(k){if(d[k]!=null)save(k,d[k])});
      location.reload();
    }catch(err){toast('Arquivo inválido. Use um backup baixado por este site.')}
  };
  rd.readAsText(f);e.target.value='';
});

/* =========================================================
   CRONÔMETRO DE FOCO (25/5, pausa longa a cada 4)
   ========================================================= */
var T={mode:'foco',end:0,left:25*60,running:false,label:'',subj:'',skipRec:false,int:null,count:0};
var DUR={foco:25*60,pausa:5*60,longa:15*60};
var tEl=document.getElementById('timer');
function tDraw(){
  var s=Math.max(0,Math.round(T.running?(T.end-Date.now())/1000:T.left));
  var txt=pad(Math.floor(s/60))+':'+pad(s%60);
  document.getElementById('tClock').textContent=txt;
  document.getElementById('tLabel').textContent=T.label||'Foco';
  document.getElementById('tMode').textContent=(T.mode==='foco'?'Foco':T.mode==='pausa'?'Pausa curta':'Pausa longa')+' · ciclos concluídos: '+T.count;
  document.getElementById('tPlay').textContent=T.running?'Pausar':'Continuar';
  document.title=T.running?txt+' · Minha Rotina':'Minha Rotina';
  if(T.running&&s<=0)tFinish();
}
function focusElapsed(){
  if(T.mode!=='foco')return 0;
  var left=T.running?Math.max(0,(T.end-Date.now())/1000):T.left;
  return Math.max(0,Math.round((DUR.foco-left)/60));
}
function startTimer(label,subj){T.label=label;T.subj=subj||'';T.mode='foco';T.left=DUR.foco;T.running=true;T.end=Date.now()+T.left*1000;tEl.hidden=false;tTick();tDraw()}
function tTick(){clearInterval(T.int);T.int=setInterval(tDraw,500)}
function beep(){try{var c=new (window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(function(t){var o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.2,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+.2);o.start(c.currentTime+t);o.stop(c.currentTime+t+.22)})}catch(e){}}
function tFinish(){
  beep();
  if(T.mode==='foco'){T.count++;var k=tk();if(T.skipRec)T.skipRec=false;else recordFocus(25);T.mode=T.count%4===0?'longa':'pausa';toast('Foco concluído. Hora da pausa.')}
  else{T.mode='foco';toast('Pausa encerrada. Bora pro próximo foco.')}
  T.left=DUR[T.mode];T.end=Date.now()+T.left*1000;
}
document.getElementById('tPlay').onclick=function(){
  if(T.running){T.left=Math.max(0,(T.end-Date.now())/1000);T.running=false}
  else{T.end=Date.now()+T.left*1000;T.running=true;tTick()}
  tDraw();
};
document.getElementById('tSkip').onclick=function(){if(T.mode==='foco'){recordFocus(focusElapsed());T.skipRec=true}T.running=true;T.end=Date.now();tDraw()};
document.getElementById('tReset').onclick=function(){if(T.mode==='foco')recordFocus(focusElapsed());T.left=DUR[T.mode];T.running=false;tDraw()};
document.getElementById('tClose').onclick=function(){if(T.mode==='foco')recordFocus(focusElapsed());T.left=DUR[T.mode];clearInterval(T.int);T.running=false;tEl.hidden=true;document.title='Minha Rotina'};

/* =========================================================
   SINCRONIZAÇÃO COM O SUPABASE
   Guarda tudo numa linha da tabela rotina_dados (uma por usuário).
   O aparelho continua salvando localmente; a nuvem recebe uma cópia
   1,5 s depois de cada mudança e é consultada ao abrir o site.
   ========================================================= */
var TABLE='rotina_dados',sb=null,user=null,syncState='off',syncMsg='',pushT=null,gen=0,recovering=false,busyReconcile=false;
function meta(k,d){return load('sync.'+k,d)}
function setMeta(k,v){rawSave('sync.'+k,v)}
function markDirty(){gen++;setMeta('dirty',true);if(user){clearTimeout(pushT);pushT=setTimeout(push,1500);setSync('busy')}}
var SLABEL={off:'Só neste aparelho',out:'Entrar',ok:'Salvo na nuvem',busy:'Salvando...',err:'Nuvem indisponível'};
function setSync(s,msg){syncState=s;syncMsg=msg||'';drawSync()}
function drawSync(){
  var d=document.getElementById('syncDot');d.className='dot'+(syncState==='ok'?' ok':syncState==='busy'?' busy':syncState==='err'?' err':'');
  document.getElementById('syncTxt').textContent=SLABEL[syncState];
  document.getElementById('syncBtn').title=syncMsg||SLABEL[syncState];
  var st=document.getElementById('syncStatus');if(st)st.textContent=SLABEL[syncState]+(syncMsg?': '+syncMsg:'');
  var la=document.getElementById('syncAt');if(la)la.textContent=lastSyncText();
}
function lastSyncText(){var a=meta('at','');return a?new Date(a).toLocaleString('pt-BR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'nunca'}
function errText(e){
  var m=(e&&e.message)||String(e);
  if(/fetch|network|load failed/i.test(m))return 'sem conexão ou projeto do Supabase pausado';
  if(/relation|does not exist|schema cache/i.test(m))return 'tabela rotina_dados não encontrada, rode o SQL de configuração';
  if(/row-level security|permission/i.test(m))return 'sem permissão, confira as regras (RLS) do SQL de configuração';
  return m;
}
function collect(){var o={};KEYS.forEach(function(k){var v=load(k,undefined);if(v!==undefined)o[k]=v});return o}
function hasLocalData(){
  return KEYS.some(function(k){
    var v=load(k,null);if(v==null||k==='best'||k==='exam')return false;
    if(k==='routine.v2')return true;
    if(Array.isArray(v))return v.length>0;
    return typeof v==='object'?Object.keys(v).length>0:!!v;
  });
}
// Chaves que versões antigas do site não conhecem. Um aparelho com o site desatualizado envia a nuvem sem elas;
// se a nuvem não tem a chave mas este aparelho tem dados, os dados são mantidos e reenviados (nunca apagados em silêncio).
var ADITIVAS=['water','waterGoal','workouts','wlog','ingCfg','vocab','ingEx','ingErr','ingLog','ingWr'];
function adopt(r,keepLocal){
  var d=r.dados||{},kept=false;
  rawSave('habitSync',d.habitSync===true);syncHabitKey();     // a nuvem decide se o registro do hábito acompanha a conta
  KEYS.forEach(function(k){
    if(d[k]!=null){rawSave(k,d[k]);return}
    if(keepLocal&&ADITIVAS.indexOf(k)>=0){
      var v=load(k,null);
      if(v!=null&&(Array.isArray(v)?v.length:typeof v==='object'?Object.keys(v).length:true)){kept=true;return}
    }
    try{localStorage.removeItem(PREFIX+k)}catch(e){}
  });
  setMeta('at',r.atualizado_em);setMeta('dirty',false);
  reloadState();render();setSync('ok');
  if(kept)markDirty();
}
function newer(a,b){return new Date(a||0).getTime()>new Date(b||0).getTime()}
async function push(){
  if(!user)return;
  var g=gen;setSync('busy');
  try{
    var res=await sb.from(TABLE).upsert({user_id:user.id,dados:collect()},{onConflict:'user_id'}).select('atualizado_em').single();
    if(res.error)throw res.error;
    setMeta('at',res.data.atualizado_em);
    if(g===gen)setMeta('dirty',false);
    setSync('ok');
  }catch(e){setSync('err',errText(e))}
}
async function reconcile(){
  if(!user||busyReconcile)return;busyReconcile=true;setSync('busy');
  try{
    var res=await sb.from(TABLE).select('dados,atualizado_em').eq('user_id',user.id).maybeSingle();
    if(res.error)throw res.error;
    var r=res.data,lastUid=meta('uid',''),at=meta('at',''),dirty=meta('dirty',false);
    if(!r){setMeta('uid',user.id);await push();return}             // primeira vez: envia o que existe aqui
    if(lastUid!==user.id){
      setMeta('uid',user.id);
      if(!lastUid&&hasLocalData()&&!confirm('Esta conta já tem dados salvos na nuvem.\n\nOK: usar os dados da nuvem neste aparelho.\nCancelar: substituir a nuvem pelos dados deste aparelho.')){await push();return}
      adopt(r);return;
    }
    if(newer(r.atualizado_em,at)){
      if(dirty&&!confirm('Houve mudanças em outro aparelho e também neste.\n\nOK: ficar com a versão da nuvem.\nCancelar: ficar com a versão deste aparelho.')){await push();return}
      adopt(r,true);return;
    }
    if(dirty){await push();return}
    setSync('ok');
  }catch(e){setSync('err',errText(e))}
  finally{busyReconcile=false}
}
function initSync(){
  if(!SUPABASE_URL||!SUPABASE_KEY){setSync('off');return}
  if(!window.supabase){setSync('err','não foi possível carregar a biblioteca do Supabase');return}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  setSync('out');
  sb.auth.onAuthStateChange(function(ev,session){
    var u=session?session.user:null;
    if(ev==='PASSWORD_RECOVERY'){recovering=true;view='conta'}
    if(u&&(!user||user.id!==u.id)){user=u;setTimeout(reconcile,0)}
    else if(!u){user=null;setSync('out')}
    if(view==='conta')render();
  });
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&user)reconcile()});
  setInterval(function(){if(user&&syncState==='err')reconcile()},60000);
}

/* Tela: Conta */
function renderConta(){
  var h='<div class="account stack">';
  if(!SUPABASE_URL||!SUPABASE_KEY){
    h+='<div class="panel"><h3>Salvar na nuvem</h3><p class="hint">A sincronização ainda não foi configurada. Seus dados estão salvos só neste aparelho.</p><p class="hint" style="margin:0">Para ativar, preencha <b>SUPABASE_URL</b> e <b>SUPABASE_KEY</b> no início do arquivo index.html e suba de novo no GitHub.</p></div>';
  }else if(!sb){
    h+='<div class="panel"><h3>Salvar na nuvem</h3><div class="msg err">Não foi possível carregar o Supabase. Confira sua internet e recarregue a página.</div></div>';
  }else if(recovering){
    h+='<div class="panel"><h3>Criar nova senha</h3><form class="form" id="pwForm"><label class="f">Nova senha<input type="password" name="pw" minlength="6" autocomplete="new-password" required></label><div><button class="btn" type="submit">Salvar nova senha</button></div></form><div id="authMsg"></div></div>';
  }else if(user){
    h+='<div class="panel"><h3>Sua conta</h3>';
    h+='<div class="kv"><span>E-mail</span><span>'+esc(user.email)+'</span></div>';
    h+='<div class="kv"><span>Status</span><span id="syncStatus"></span></div>';
    h+='<div class="kv"><span>Última sincronização</span><span id="syncAt"></span></div>';
    h+='<div class="row" style="margin-top:14px"><button class="btn" data-act="sync-now">Sincronizar agora</button><button class="btn ghost" data-act="logout">Sair</button></div>';
    h+='<p class="hint" style="margin:14px 0 0">Se o status ficar como "Nuvem indisponível" por vários dias, o Supabase pausou seu projeto por falta de uso. Reative no painel do Supabase e volte para a rotina. Enquanto isso, tudo continua salvo neste aparelho.</p></div>';
  }else{
    h+='<div class="panel"><h3>Entrar</h3><p class="hint" style="margin:0">Entre para salvar sua rotina na nuvem e usar os mesmos dados no celular e no computador.</p>';
    h+='<form class="form" id="authForm"><label class="f">E-mail<input type="email" name="email" autocomplete="email" required></label>';
    h+='<label class="f">Senha<input type="password" name="pw" minlength="6" autocomplete="current-password" required></label>';
    h+='<div class="row"><button class="btn" type="submit">Entrar</button><button class="btn ghost" type="button" data-act="signup">Criar conta</button><button class="link" type="button" data-act="forgot">Esqueci a senha</button></div></form><div id="authMsg"></div></div>';
  }
  h+=installPanel();
  return h+'</div>';
}
function isStandalone(){return window.navigator.standalone===true||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)}
function installPanel(){
  var h='<div class="panel" id="installPanel"><h3>Instalar no iPhone</h3>';
  if(isStandalone())return h+'<p class="hint" style="margin:0">Você está usando o app instalado. Mantenha o login ativo acima para os dados sincronizarem com seus outros aparelhos.</p></div>';
  h+='<ol class="plan"><li>Abra este site no <b>Safari</b>.</li><li>Toque em <b>Compartilhar</b> (o quadrado com a seta) e depois em <b>Adicionar à Tela de Início</b>. Em alguns iOS essa opção fica em "Ver mais".</li><li>Abra o app pelo ícone novo, não pelo Safari.</li></ol>';
  h+='<p class="hint" style="margin:12px 0 0">O app instalado guarda os dados <b>separados do Safari</b>. Entre na sua conta dentro dele para a rotina sincronizar. O registro do hábito não sincroniza por padrão: ative a sincronização em Hábitos, Configurações deste registro, ou comece o registro direto no app instalado.</p></div>';
  return h;
}
function authMsg(t,ok){var m=document.getElementById('authMsg');if(m)m.innerHTML='<div class="msg '+(ok?'ok':'err')+'">'+esc(t)+'</div>'}
function authErr(e){
  var m=(e&&e.message)||'';
  if(/invalid login/i.test(m))return 'E-mail ou senha incorretos.';
  if(/not confirmed/i.test(m))return 'Confirme seu e-mail pelo link que enviamos antes de entrar.';
  if(/already registered|already exists/i.test(m))return 'Este e-mail já tem conta. Use Entrar.';
  if(/password/i.test(m)&&/6/.test(m))return 'A senha precisa ter pelo menos 6 caracteres.';
  if(/rate limit/i.test(m))return 'Muitas tentativas seguidas. Espere alguns minutos e tente de novo.';
  return errText(e);
}
function formVals(){var f=document.getElementById('authForm');return f?{email:f.email.value.trim(),pw:f.pw.value,form:f}:null}
var HERE=location.origin+location.pathname;
main.addEventListener('click',async function(e){
  var b=e.target.closest('[data-act]');if(!b||!sb)return;
  var a=b.dataset.act;
  if(a==='signup'){
    var v=formVals();if(!v.form.reportValidity())return;
    var r=await sb.auth.signUp({email:v.email,password:v.pw,options:{emailRedirectTo:HERE}});
    if(r.error)return authMsg(authErr(r.error));
    if(!r.data.session)authMsg('Conta criada. Abra o link de confirmação que enviamos para '+v.email+' e depois entre aqui.',true);
  }else if(a==='forgot'){
    var v2=formVals();if(!v2.email){authMsg('Digite seu e-mail no campo acima e clique de novo em Esqueci a senha.');return}
    var r2=await sb.auth.resetPasswordForEmail(v2.email,{redirectTo:HERE});
    if(r2.error)return authMsg(authErr(r2.error));
    authMsg('Enviamos um link para criar uma nova senha em '+v2.email+'.',true);
  }else if(a==='logout'){
    await sb.auth.signOut();user=null;setMeta('uid','');setMeta('at','');setSync('out');render();toast('Você saiu. Os dados continuam neste aparelho.');
  }else if(a==='sync-now'){await reconcile();if(syncState==='ok')toast('Sincronizado')}
});
main.addEventListener('submit',async function(e){
  var f=e.target;if(!sb)return;
  if(f.id==='authForm'){
    var r=await sb.auth.signInWithPassword({email:f.email.value.trim(),password:f.pw.value});
    if(r.error)authMsg(authErr(r.error));else toast('Entrou. Sincronizando seus dados...');
  }else if(f.id==='pwForm'){
    var r2=await sb.auth.updateUser({password:f.pw.value});
    if(r2.error)return authMsg(authErr(r2.error));
    recovering=false;render();toast('Senha alterada');
  }
});

function applyTheme(){if(theme==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',theme)}
document.getElementById('themeBtn').onclick=function(){
  var dark=theme==='dark'||(theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
  theme=dark?'light':'dark';save('theme',theme);applyTheme();
};
var lastDay=tk();
setInterval(function(){var k=tk();if(k!==lastDay){lastDay=k;render()}},60000);

applyTheme();
render();
initSync();
drawSync();
// PWA: abre sem internet (veja sw.js). Só em http/https; no arquivo local (file://) não registra.
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  var regSW=function(){navigator.serviceWorker.register('sw.js').catch(function(){})};
  if(document.readyState==='complete')regSW();else window.addEventListener('load',regSW);
}
